<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verificación de seguridad · SPES Systems</title>
<!--
  Página que usa el POS de escritorio (Electron) para resolver el captcha de
  Cloudflare Turnstile antes de iniciar sesión o crear cuenta. Turnstile no
  funciona dentro de la app (no tiene dominio), así que el POS abre esta
  página en una ventanita; al resolverse, la página navega a /captcha-ok?t=…
  y el POS intercepta esa navegación (nunca se carga) para leer el token.
  Ver 01. Aplicacion/Punto de Venta/src/main/captcha.ts
-->
<style>
  html,body{ margin:0; height:100%; background:#0b0d12; color:#e8eaf0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  img{ width:56px; height:56px; border-radius:14px; }
  h1{ font-size:18px; margin:0; }
  p{ margin:0; color:rgba(232,234,240,.65); font-size:13px; max-width:320px; }
  #msg.err{ color:#ff8a8a; }
</style>
</head>
<body>
<div class="wrap">
  <img src="/assets/spes-logo.jpeg" alt="SPES Systems">
  <h1>Verificación de seguridad</h1>
  <p>Confirma que eres una persona para continuar en SPES.</p>
  <div id="ts"></div>
  <p id="msg"></p>
</div>
<script>
(function(){
  var SITEKEY='0x4AAAAAADkGkS8LBw02W1fz';
  var DONE='/captcha-ok?t=';
  var msg=document.getElementById('msg');
  var s=document.createElement('script');
  s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  s.async=true;
  s.onload=function(){
    window.turnstile.render('#ts',{
      sitekey:SITEKEY, theme:'dark', action:'pos_login', language:'es',
      callback:function(token){ msg.textContent='Listo, regresando a SPES…'; location.href=DONE+encodeURIComponent(token); },
      'error-callback':function(){ msg.textContent='No se pudo verificar. Cierra esta ventana e inténtalo de nuevo.'; msg.className='err'; },
      'expired-callback':function(){ msg.textContent='La verificación expiró, resuélvela de nuevo.'; }
    });
  };
  s.onerror=function(){ msg.textContent='No se pudo cargar la verificación. Revisa tu internet.'; msg.className='err'; };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
