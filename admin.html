<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SPES · Panel de Administración</title>
<style>
  :root{ color-scheme: light; --bg:#f4f4f5; --panel:#fff; --bd:#e4e4e7; --bd2:#f0f0f1; --ink:#18181b; --muted:#71717a; --faint:#a1a1aa; --accent:#000; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--bg); color:var(--ink); }
  .hidden{ display:none !important; }
  a{ color:inherit; }
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--panel); border:1px solid var(--bd); border-radius:16px; }
  .loginbox{ width:100%; max-width:360px; padding:32px; text-align:center; }
  .logo{ width:48px;height:48px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:24px;margin:0 auto 14px; }
  h1{ font-size:18px; font-weight:800; }
  .muted{ color:var(--muted); font-size:13px; }
  input,select,textarea{ width:100%; padding:10px 12px; border:1px solid #d4d4d8; border-radius:9px; font-size:14px; margin-top:10px; background:#fff; font-family:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:#000; color:#fff; border:0; border-radius:9px; padding:9px 14px; font-weight:700; font-size:13px; }
  .btn:hover{ opacity:.9; } .btn.sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid #d4d4d8; }
  .btn.danger{ background:#dc2626; color:#fff; }
  .msg{ font-size:13px; margin-top:12px; min-height:18px; } .err{ color:#dc2626; } .ok{ color:#16a34a; }
  #app{ display:flex; min-height:100vh; }
  aside{ width:230px; background:#0b0b0c; color:#e4e4e7; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  aside .brand{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid #27272a; position:sticky; top:0; background:#0b0b0c; }
  aside .brand .logo{ width:30px;height:30px;font-size:15px;border-radius:8px;margin:0; }
  aside .brand b{ font-size:14px; }
  nav{ padding:8px 8px 24px; }
  nav .grp{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#71717a; padding:14px 12px 6px; }
  nav a{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:8px; font-size:13px; color:#d4d4d8; text-decoration:none; cursor:pointer; }
  nav a:hover{ background:#1c1c1f; color:#fff; }
  nav a.active{ background:#fff; color:#000; font-weight:600; }
  nav a .soon{ font-size:9px; background:#27272a; color:#a1a1aa; border-radius:5px; padding:1px 5px; }
  nav a.active .soon{ background:#e4e4e7; color:#52525b; }
  .wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
  header{ background:#fff; border-bottom:1px solid var(--bd); padding:12px 22px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
  header .vt{ font-size:15px; font-weight:800; } header .sp{ margin-left:auto; }
  main{ padding:22px; max-width:1180px; width:100%; }
  #menuBtn{ display:none; }
  @media(max-width:860px){
    aside{ position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s; }
    aside.open{ transform:none; }
    #menuBtn{ display:inline-flex; }
  }
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media(max-width:860px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:#fff; border:1px solid var(--bd); border-radius:13px; padding:14px; }
  .kpi .n{ font-size:24px; font-weight:800; } .kpi .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .kpi.soon{ opacity:.6; } .kpi .soontag{ font-size:9px; background:#f4f4f5; color:#71717a; border-radius:5px; padding:1px 6px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:860px){ .grid2{ grid-template-columns:1fr; } }
  .sec{ margin-bottom:18px; }
  .sechead{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .sechead h2{ font-size:15px; font-weight:800; } .sechead .sp{ margin-left:auto; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--bd); border-radius:13px; overflow:hidden; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--bd2); background:#fafafa; }
  td{ padding:9px 12px; border-bottom:1px solid #f4f4f5; vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  .tag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .t-activa{ background:#dcfce7; color:#166534; } .t-prueba{ background:#e0e7ff; color:#3730a3; }
  .t-suspendida{ background:#fee2e2; color:#991b1b; } .t-cancelada{ background:#f4f4f5; color:#52525b; } .t-none{ background:#f4f4f5; color:#52525b; }
  .t-archivado{ background:#fef3c7; color:#92400e; }
  .t-nuevo{ background:#dbeafe; color:#1e40af; } .t-leido{ background:#f4f4f5; color:#52525b; } .t-proceso{ background:#fef9c3; color:#854d0e; }
  .t-respondido{ background:#dcfce7; color:#166534; } .t-web{ background:#e0e7ff; color:#3730a3; } .t-restaurantes{ background:#ffedd5; color:#9a3412; }
  .danger{ color:#dc2626; } .warn{ color:#d97706; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .state{ padding:24px; text-align:center; color:var(--muted); }
  .hint{ font-size:12px; color:var(--muted); margin-bottom:10px; }
  .panel{ background:#fff; border:1px solid var(--bd); border-radius:13px; padding:16px; }
  .panel h3{ font-size:13px; font-weight:800; margin-bottom:10px; }
  .feed{ list-style:none; display:flex; flex-direction:column; gap:2px; }
  .feed li{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid #f4f4f5; font-size:13px; }
  .feed li:last-child{ border-bottom:0; }
  .feed .dot{ width:7px;height:7px;border-radius:99px;flex-shrink:0;background:#a1a1aa; }
  .feed .d-pago{ background:#16a34a; } .feed .d-registro{ background:#2563eb; } .feed .d-mensaje{ background:#d97706; }
  .feed time{ color:var(--faint); font-size:11px; white-space:nowrap; }
  .back{ font-size:13px; color:#2563eb; cursor:pointer; display:inline-block; margin-bottom:12px; }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13px; }
  .kv dt{ color:var(--muted); } .kv dd{ font-weight:600; }
  .soonbox{ padding:40px; text-align:center; color:var(--muted); }
  .soonbox .big{ font-size:16px; font-weight:800; color:var(--ink); margin-bottom:6px; }
  /* MODAL */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal{ background:#fff; border-radius:14px; padding:22px; width:100%; max-width:430px; box-shadow:0 20px 60px -20px rgba(0,0,0,.4); max-height:90vh; overflow-y:auto; }
  .modal h3{ font-size:16px; font-weight:800; margin-bottom:2px; }
  .flbl{ display:block; font-size:12px; color:#71717a; margin-top:10px; font-weight:600; }
  .mtotal{ margin-top:14px; font-weight:800; font-size:18px; }
  .mrow{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  #filebanner{ background:#fef2f2; color:#991b1b; border-bottom:1px solid #fecaca; padding:12px 18px; font-size:13px; text-align:center; }
  #filebanner code{ background:#fff; padding:1px 6px; border-radius:5px; border:1px solid #fecaca; }
</style>
<link rel="stylesheet" href="/spes-ui.css">
<style>

  .loginbox .logo{ width:48px;height:48px;border-radius:12px;background:#111318;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:24px;margin:0 auto 14px; }
  .loginbox h1{ font-size:18px; font-weight:800; }

</style>
</head>
<body>

<div id="filebanner" class="hidden">
  Abriste el panel como archivo local; así el inicio de sesión no funciona.
  Súbelo a tu sitio y ábrelo en <code>https://spessystems.com/admin.html</code>.
</div>

<div id="login">
  <div class="card loginbox">
    <div class="logo">S.</div>
    <h1>Panel de Administración</h1>
    <p class="muted">SPES Systems</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Correo" required autocomplete="username">
      <input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:14px" type="submit">Entrar</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>
</div>

<div id="app" class="spes-app hidden">
  <aside id="aside" class="spes-sidebar">
    <div class="spes-brand"><span class="logo">S.</span><b>SPES · Admin</b></div>
    <nav id="nav" class="spes-nav"></nav>
    <button id="collapseBtn" class="spes-nav-item" style="margin:2px 10px 12px;width:auto;border:0;background:transparent;color:var(--sidebar-muted);cursor:pointer"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Colapsar</span></button>
  </aside>
  <div class="spes-wrap">
    <header class="spes-topbar">
      <button class="spes-iconbtn" id="menuBtn" aria-label="Menú">☰</button>
      <span class="vt" id="viewTitle">Dashboard</span>
      <span class="sp"></span>
      <span class="muted" id="who"></span>
      <button class="btn ghost sm" id="logout">Salir</button>
    </header>
    <main id="main" class="spes-main">
      <div id="notadmin" class="state hidden" style="margin-bottom:20px">
        Esta cuenta (<b id="na-email"></b>) no está autorizada para el panel. Entra con tu cuenta de administrador.
      </div>
      <div id="content"></div>
    </main>
  </div>
  <div id="backdrop" class="spes-backdrop"></div>
</div>

<div id="modal" class="modal-overlay hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="/spes-ui.js"></script>
<script>
  const SB_URL='https://khpecvszzhyygqudeagr.supabase.co';
  const SB_KEY='sb_publishable_FvWr_E6vuc7Gf3GRkzh62Q_kfzmPVp8';
  const PRECIOS = { basico:349, pro:599, multisucursal:999 };

  if(location.protocol==='file:') document.getElementById('filebanner').classList.remove('hidden');

  const memStore={};
  const safeStorage={
    getItem:k=>{ try{ return window.localStorage.getItem(k); }catch(_){ return (k in memStore)?memStore[k]:null; } },
    setItem:(k,v)=>{ try{ window.localStorage.setItem(k,v); }catch(_){ memStore[k]=String(v); } },
    removeItem:k=>{ try{ window.localStorage.removeItem(k); }catch(_){ delete memStore[k]; } }
  };
  const sb = supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage } });
  // Bloque 0.2: las tablas de gestión del SaaS viven en el esquema 'control' (los RPCs siguen en public).
  const sbc = sb.schema('control');

  const $ = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => '$'+(Math.round(Number(n)||0)).toLocaleString('es-MX');
  function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function ymd(d){ return new Date(d).toISOString().slice(0,10); }
  function daysLeft(v){ if(!v) return null; return Math.ceil((new Date(v+'T00:00:00') - new Date(new Date().toDateString()))/86400000); }
  function fdate(s){ try{ return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'}); }catch(e){ return s||'—'; } }
  function fdatetime(s){ try{ return new Date(s).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s||'—'; } }
  const subOf = b => Array.isArray(b.subscriptions) ? (b.subscriptions[0]||null) : (b.subscriptions||null);
  function planPrecio(clave){ const p=ST.PLANES.find(x=>x.clave===clave); return p?Number(p.precio_mxn):(PRECIOS[clave]||0); }
  const precioDe = s => s ? (s.precio_mxn!=null ? Number(s.precio_mxn) : planPrecio(s.plan)) : 0;
  function planOptions(){ const ps=ST.PLANES.length?ST.PLANES:[{clave:'basico',nombre:'Básico'},{clave:'pro',nombre:'Pro'},{clave:'multisucursal',nombre:'Multisucursal'}]; return ps.map(p=>({value:p.clave,label:p.nombre})); }

  // ===== MODALES (reemplazan alert/prompt/confirm) =====
  function modalShell(inner){ const m=$('modal'); m.innerHTML='<div class="modal">'+inner+'</div>'; m.classList.remove('hidden'); }
  function closeModal(){ const m=$('modal'); m.classList.add('hidden'); m.innerHTML=''; }
  $('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

  function notify(msg, type){
    modalShell('<h3>'+(type==='error'?'Atención':'Listo')+'</h3><p style="margin-top:8px;color:#3f3f46;font-size:14px">'+esc(msg)+'</p><div class="mrow"><button class="btn" id="m_ok">Entendido</button></div>');
    $('m_ok').onclick=closeModal;
  }
  function confirmModal(o){
    o=o||{};
    return new Promise(res=>{
      modalShell('<h3>'+esc(o.title||'Confirmar')+'</h3><p style="margin-top:8px;color:#3f3f46;font-size:14px">'+esc(o.message||'')+'</p>'
        +(o.requireType?'<label class="flbl">Escribe '+esc(o.requireType)+' para confirmar</label><input id="m_type" autocomplete="off">':'')
        +'<div class="mrow"><button class="btn ghost" id="m_no">Cancelar</button><button class="btn '+(o.danger?'danger':'')+'" id="m_yes">'+esc(o.confirmLabel||'Confirmar')+'</button></div>');
      $('m_no').onclick=()=>{ closeModal(); res(false); };
      $('m_yes').onclick=()=>{ if(o.requireType && $('m_type').value!==o.requireType){ return; } closeModal(); res(true); };
    });
  }
  function formModal(o){
    o=o||{};
    return new Promise(res=>{
      let body='';
      for(const f of o.fields){
        body+='<label class="flbl">'+esc(f.label)+'</label>';
        if(f.type==='select'){
          body+='<select id="f_'+f.key+'">'+f.options.map(op=>{ const v=(typeof op==='string')?op:op.value; const l=(typeof op==='string')?op:op.label; return '<option value="'+esc(v)+'" '+(String(f.value)===String(v)?'selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select>';
        } else if(f.type==='textarea'){
          body+='<textarea id="f_'+f.key+'" rows="'+(f.rows||3)+'">'+esc(f.value||'')+'</textarea>';
        } else {
          body+='<input id="f_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value==null?'':f.value)+'"'+(f.min!=null?' min="'+f.min+'"':'')+(f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>';
        }
      }
      modalShell('<h3>'+esc(o.title||'')+'</h3>'+(o.subtitle?'<p class="muted">'+esc(o.subtitle)+'</p>':'')+body+'<p id="f_err" class="msg err"></p><div class="mrow"><button class="btn ghost" id="f_cancel">Cancelar</button><button class="btn" id="f_save">'+esc(o.submitLabel||'Guardar')+'</button></div>');
      if(o.onRender) o.onRender();
      $('f_cancel').onclick=()=>{ closeModal(); res(null); };
      $('f_save').onclick=()=>{
        const vals={};
        for(const f of o.fields) vals[f.key]=$('f_'+f.key).value;
        for(const f of o.fields){ if(f.required && !String(vals[f.key]).trim()){ $('f_err').textContent='Completa: '+f.label; return; } }
        closeModal(); res(vals);
      };
    });
  }

  function traducirAuth(msg){
    const m=(msg||'').toLowerCase();
    if(m.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
    if(m.includes('email not confirmed')) return 'Tu correo aún no está confirmado.';
    if(m.includes('failed to fetch')||m.includes('network')) return 'Sin conexión. Ábrelo en https://spessystems.com/admin.html';
    return msg || 'No se pudo iniciar sesión.';
  }

  // ===== AUTH =====
  $('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const m=$('loginMsg'); m.textContent='Entrando…'; m.className='msg';
    try{
      const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
      if(error){ m.textContent=traducirAuth(error.message); m.className='msg err'; }
    }catch(err){ m.textContent=traducirAuth(err && err.message); m.className='msg err'; }
  });
  async function cerrarSesion(){
    try{ await sb.auth.signOut({ scope:'local' }); }catch(_){ }
    try{ Object.keys(window.localStorage).filter(k=>k.indexOf('sb-')===0).forEach(k=>window.localStorage.removeItem(k)); }catch(_){ }
    showLogin();
  }
  $('logout').addEventListener('click', cerrarSesion);
  $('menuBtn').addEventListener('click', ()=> $('aside').classList.toggle('open'));

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='INITIAL_SESSION') return;
    if(!session || event==='SIGNED_OUT'){ showLogin(); return; }
    showApp(session);
  });
  (async ()=>{
    try{
      const { data } = await sb.auth.getSession();
      if(!data || !data.session){ showLogin(); return; }
      const { error } = await sb.auth.getUser();
      if(error){ await cerrarSesion(); } else { showApp(data.session); }
    }catch(_){ await cerrarSesion(); }
  })();

  function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

  // ===== STATE =====
  const ST = { view:'dashboard', clienteId:null, param:null, isPrincipal:false, email:'',
    NEGOCIOS:[], LEADS:[], PAGOS:[], ADMINS:[], VERSIONES:[], NOTAS:[], PLANES:[],
    TICKETS:[], TMSGS:[], ANUNCIOS:[], KB:[], CONFIG:null, FLEET:[] };

  const NAV = [
    { items:[ {id:'dashboard',label:'Dashboard'} ] },
    { group:'CRM', items:[ {id:'clientes',label:'Clientes'},{id:'mensajes',label:'Mensajes'},{id:'empresas',label:'Empresas',soon:1},{id:'contactos',label:'Contactos',soon:1} ] },
    { group:'Suscripciones', items:[ {id:'planes',label:'Planes'},{id:'pagos',label:'Pagos'},{id:'renovaciones',label:'Renovaciones'},{id:'facturacion',label:'Facturación'},{id:'membresias',label:'Membresías',soon:1} ] },
    { group:'Soporte', items:[ {id:'tickets',label:'Tickets'},{id:'kb',label:'Base de conocimiento'},{id:'anuncios',label:'Anuncios'},{id:'conversaciones',label:'Conversaciones',soon:1} ] },
    { group:'Productos', items:[ {id:'actualizaciones',label:'Actualizaciones'},{id:'licencias',label:'Licencias'},{id:'pf',label:'POS Frutería',soon:1},{id:'pr',label:'POS Restaurante',soon:1},{id:'pg',label:'POS Gimnasio',soon:1},{id:'hardware',label:'Hardware',soon:1} ] },
    { group:'Usuarios', items:[ {id:'roles',label:'Roles'},{id:'permisos',label:'Permisos'} ] },
    { group:'Marketing', items:[ {id:'formularios',label:'Formularios',soon:1},{id:'newsletter',label:'Newsletter',soon:1} ] },
    { group:'Analíticas', items:[ {id:'an_ventas',label:'Ventas',soon:1},{id:'an_ingresos',label:'Ingresos',soon:1},{id:'an_churn',label:'Churn',soon:1},{id:'an_conv',label:'Conversión',soon:1},{id:'an_uso',label:'Uso del sistema',soon:1} ] },
    { group:'Infraestructura', items:[ {id:'flota',label:'Flota'},{id:'inf_estado',label:'Estado',soon:1},{id:'inf_serv',label:'Servidores',soon:1},{id:'inf_db',label:'Base de datos',soon:1},{id:'inf_backups',label:'Backups',soon:1},{id:'inf_logs',label:'Logs',soon:1} ] },

  // ===== DASHBOARD =====
  function metrics(){
    let activas=0,prueba=0,susp=0,arch=0,mrr=0,nuevos=0;
    const hoy=new Date();
    for(const b of ST.NEGOCIOS){
      if(b.archivado){ arch++; continue; }
      const s=subOf(b); const dl=s?daysLeft(s.vence):null;
      if(s){
        if(s.estado==='activa'){ activas++; mrr+=precioDe(s); }
        else if(s.estado==='prueba'){ prueba++; }
        if(s.estado==='suspendida' || (dl!=null && dl<0 && s.estado!=='cancelada')) susp++;
      }
      if(b.created_at && (hoy-new Date(b.created_at))/86400000<=30) nuevos++;
    }
    return { activas,prueba,susp,arch,mrr,arr:mrr*12,nuevos };
  }
  function actividadFeed(){
    const f=[];
    ST.NEGOCIOS.forEach(b=>{ if(b.created_at) f.push({t:b.created_at,tipo:'registro',txt:'Nuevo registro · '+(b.business_name||'(sin nombre)')}); });
    ST.PAGOS.forEach(p=>{ f.push({t:p.created_at,tipo:'pago',txt:'Pago '+money(p.monto)+' · '+nameOf(p.business_id)}); });
    ST.LEADS.forEach(l=>{ f.push({t:l.created_at,tipo:'mensaje',txt:'Mensaje de '+(l.nombre||'—')+(l.negocio?' ('+l.negocio+')':'')}); });
    return f.filter(x=>x.t).sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,12);
  }

    const s=subOf(b); if(!s) return '<span class="tag t-none">sin suscripción</span>';
    const dl=daysLeft(s.vence);

    return '<span class="tag t-'+esc(s.estado)+'">'+esc(s.estado)+'</span>';
  }

  // ===== ACCIONES DE CLIENTE (todas con modal) =====
  async function accionCliente(act,b){
    const s=subOf(b);
    if(act==='pago') return openPagoModal(b);
    if(act==='vercliente') return verComoCliente(b);
    if(act==='mensaje') return enviarMensajeCliente(b);
    if(act==='plan'){
      const v=await formModal({title:'Cambiar plan', subtitle:esc(b.business_name||''), fields:[{key:'plan',label:'Plan',type:'select',value:s?s.plan:'basico',options:planOptions()}], submitLabel:'Cambiar'});
      if(!v) return; if(!(await updSub(b,{plan:v.plan}))) return;
    } else if(act==='precio'){
      const cur=s&&s.precio_mxn!=null?s.precio_mxn:(s?planPrecio(s.plan):0);
      const v=await formModal({title:'Cambiar precio', subtitle:'Déjalo vacío para usar el precio de lista', fields:[{key:'precio',label:'Precio MXN/mes',type:'number',value:cur,min:0}], submitLabel:'Guardar'});
      if(!v) return; const t=String(v.precio).trim(); const num=t===''?null:Number(v.precio);
      if(t!==''&&!(num>=0)) return notify('Precio inválido.','error');
      if(!(await updSub(b,{precio_mxn:num}))) return;
    } else if(act==='extender'){
      const v=await formModal({title:'Extender licencia', subtitle:esc(b.business_name||''), fields:[{key:'dias',label:'Días a extender',type:'number',value:30,min:1}], submitLabel:'Extender'});
      if(!v) return; const d=parseInt(v.dias); if(!d||d<1) return;
      const base=(s&&s.vence&&new Date(s.vence)>new Date())?new Date(s.vence):new Date();
      if(!(await updSub(b,{vence:ymd(addDays(base,d)),estado:'activa'}))) return;
    } else if(act==='prueba'){
      if(!await confirmModal({title:'Reiniciar prueba',message:'Se pondrá una prueba de 14 días desde hoy.',confirmLabel:'Reiniciar'})) return;
      if(!(await updSub(b,{estado:'prueba',vence:ymd(addDays(new Date(),14))}))) return;
    } else if(act==='suspender'){
      if(!await confirmModal({title:'Suspender cuenta',message:'El POS le pedirá renovar al iniciar sesión.',danger:true,confirmLabel:'Suspender'})) return;
      if(!(await updSub(b,{estado:'suspendida'}))) return;
    } else if(act==='reactivar'){
      if(!(await updSub(b,{estado:'activa'}))) return;
    } else if(act==='editar'){
      const v=await formModal({title:'Editar datos', fields:[

  // ===== RECIBO PDF =====
  let _jspdfReady=null;
  function ensureJsPDF(){
    const get=()=>(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF||null;
    if(get()) return Promise.resolve(get());
    if(_jspdfReady) return _jspdfReady;
    _jspdfReady=new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
      s.onload=()=>{ const g=get(); g?res(g):rej(new Error('jsPDF cargó pero no expuso el módulo')); };
      s.onerror=()=>rej(new Error('No se pudo descargar jsPDF (¿bloqueado por CSP o sin red?)'));
      document.head.appendChild(s);
    });
    return _jspdfReady;
  }
  async function genRecibo(pid){
    const p=ST.PAGOS.find(x=>x.id===pid); if(!p) return;
    let JS;
    try{ JS=await ensureJsPDF(); }catch(e){ notify('No se pudo cargar el generador de PDF: '+(e.message||e),'error'); return; }
    try{
    const b=ST.NEGOCIOS.find(x=>x.id===p.business_id)||{};
    const doc=new JS(); const emp=ST.CONFIG||{};
    doc.setFontSize(20); doc.text(emp.empresa_nombre||'SPES Systems',20,22);
    doc.setFontSize(10); doc.setTextColor(120); doc.text('spessystems.com · Recibo de pago',20,28); doc.setTextColor(0);
    const folio='REC-'+String(p.id).slice(0,8).toUpperCase();
    let y=46; doc.setFontSize(11);
    const line=(k,v)=>{ doc.setTextColor(120); doc.text(k,20,y); doc.setTextColor(0); doc.text(String(v||'—'),75,y); y+=8; };
    line('Folio',folio); line('Fecha',fdate(p.created_at)); line('Cliente',b.business_name||'—');
    if(b.razon_social) line('Razón social',b.razon_social);
    if(b.rfc) line('RFC',b.rfc);
    line('Concepto',p.nota||'Suscripción SPES'); line('Método',p.metodo||'—');
    line('Cubre hasta',p.cubre_hasta?fdate(p.cubre_hasta):'—');
    y+=4; doc.setDrawColor(220); doc.line(20,y,190,y); y+=12;
    doc.setFontSize(15); doc.text('Total: '+money(p.monto),20,y);
    y+=18; doc.setFontSize(9); doc.setTextColor(140);
    doc.text('Comprobante de pago, no es una factura fiscal (CFDI).',20,y);
    doc.save(folio+'.pdf');
    }catch(e){ notify('Error al generar el PDF: '+(e.message||e),'error'); }
  }

  // ===== FLOTA (Bloque 0.4: observabilidad) =====
  // Cada instalación del POS reporta versión + última conexión vía el RPC
  // fleet_heartbeat (al arrancar y cada 6 h). Aquí se ve la flota y salta la
  // alerta de clientes con demasiados días sin conectar.
  const FLOTA_ALERTA_DIAS = 7;
  async function renderFlota(c){
    c.innerHTML='<div class="card state">Cargando flota…</div>';
    const { data, error } = await sbc.from('fleet').select('*').order('last_seen_at',{ascending:false});
    if(ST.view!=='flota') return; // el usuario ya navegó a otra pantalla
    if(error){ c.innerHTML='<div class="card state" style="color:#dc2626">Error al cargar la flota: '+esc(error.message)+'</div>'; return; }
    const rows=data||[];
    const latest=(ST.VERSIONES.find(v=>v.publicada)||ST.VERSIONES[0]||{}).version||null;
    const now=Date.now();
    const daysAgo=ts=>Math.max(0, Math.floor((now-new Date(ts).getTime())/86400000));

    // Agrupar por cuenta: una cuenta está "conectada" si CUALQUIERA de sus
    // dispositivos dio señal de vida recientemente.
    const byAcc={};
    rows.forEach(r=>{ (byAcc[r.account_id]=byAcc[r.account_id]||[]).push(r); });
    const cuentas=Object.entries(byAcc).map(([acc,list])=>({
      acc, list,
      minDays:Math.min.apply(null, list.map(r=>daysAgo(r.last_seen_at))),
      last:list.reduce((m,r)=> new Date(r.last_seen_at)>new Date(m)?r.last_seen_at:m, list[0].last_seen_at)
    }));
    const desconectadas=cuentas.filter(x=>x.minDays>=FLOTA_ALERTA_DIAS).sort((a,b)=>b.minDays-a.minDays);
    const hoy=cuentas.filter(x=>x.minDays<1).length;

    const estadoTagF=d=> d<2 ? '<span class="tag t-activa">al día</span>'
      : d<FLOTA_ALERTA_DIAS ? '<span class="tag t-proceso">'+d+' días</span>'
      : '<span class="tag t-suspendida">'+d+' días sin conectar</span>';
    const verTag=v=> !v ? '—'
      : (latest && v!==latest ? esc(v)+' <span class="tag t-archivado">desactualizada</span>'
      : esc(v)+(latest?' <span class="tag t-activa">última</span>':''));

    let h=`<p class="hint">Cada instalación del POS reporta su versión y última conexión al arrancar y cada 6 horas (solo datos técnicos, nada del negocio). Última versión publicada: ${latest?'v'+esc(latest):'—'}.</p>`;
    h+=`<div class="kpis">
      <div class="kpi"><div class="n">${rows.length}</div><div class="l">Dispositivos</div></div>
      <div class="kpi"><div class="n">${cuentas.length}</div><div class="l">Cuentas con POS activo</div></div>
      <div class="kpi"><div class="n">${hoy}</div><div class="l">Conectadas hoy</div></div>
      <div class="kpi"><div class="n ${desconectadas.length?'danger':''}">${desconectadas.length}</div><div class="l">Sin conectar ≥ ${FLOTA_ALERTA_DIAS} días</div></div>
    </div>`;
    if(desconectadas.length){
      h+='<div class="sec"><div class="sechead"><h2 class="danger">⚠ Clientes sin conectar (alerta)</h2></div><table><thead><tr><th>Negocio</th><th>Días sin conectar</th><th>Última conexión</th></tr></thead><tbody>';
      for(const x of desconectadas) h+=`<tr><td><strong>${esc(nameOf(x.acc))}</strong></td><td class="danger"><strong>${x.minDays}</strong></td><td>${fdatetime(x.last)}</td></tr>`;
      h+='</tbody></table></div>';
    }
    if(!rows.length){
      h+='<div class="card state">Aún no hay latidos: ninguna instalación con heartbeat (v0.4.1+) se ha conectado.</div>';
    } else {
      h+='<div class="sec"><div class="sechead"><h2>Dispositivos</h2></div><table><thead><tr><th>Negocio</th><th>Dispositivo</th><th>Versión</th><th>Plataforma</th><th>Última conexión</th><th>Estado</th></tr></thead><tbody>';
      for(const r of rows) h+=`<tr><td><strong>${esc(nameOf(r.account_id))}</strong></td><td class="muted">${esc(String(r.device_id).slice(0,8))}</td><td>${verTag(r.app_version)}</td><td class="muted">${esc(r.platform||'—')}</td><td>${fdatetime(r.last_seen_at)}</td><td>${estadoTagF(daysAgo(r.last_seen_at))}</td></tr>`;
      h+='</tbody></table></div>';
    }
    c.innerHTML=h;
  }

  async function addAdmin(){
    if(!ST.isPrincipal) return notify('Solo el admin principal puede agregar administradores.','error');
    const v=await formModal({title:'Agregar administrador', subtitle:'La persona debe tener ya una cuenta (correo) en SPES.', fields:[{key:'email',label:'Correo del nuevo admin',value:'',required:true}], submitLabel:'Buscar y agregar'});
    if(!v) return;
    const email=(v.email||'').trim().toLowerCase();
    const { data:uid, error }=await sb.rpc('find_user_id_by_email',{ p_email:email });
    if(error){ notify('No se pudo buscar: '+error.message,'error'); return; }
    if(!uid){ notify('No encontré una cuenta con ese correo. Pídele que primero cree su cuenta (en el POS o registrándose) y vuelve a intentar.','error'); return; }
    if(ST.ADMINS.some(a=>a.user_id===uid)){ notify('Esa cuenta ya es administrador.','error'); return; }
    const { error:iErr }=await sbc.from('admins').insert({ user_id:uid });
    if(iErr){ notify('No se pudo agregar: '+iErr.message,'error'); return; }
    await loadAll(); render(); notify('¡Administrador agregado!','ok');
  }

          <li><span class="dot d-pago"></span><span>Eliminar clientes definitivamente</span></li>
          <li><span class="dot d-pago"></span><span>Editar la configuración de la empresa</span></li>
        </ul></div>
        <div class="panel"><h3>Operador</h3><ul class="feed">
          <li><span class="dot d-registro"></span><span>Ver clientes, mensajes, pagos, tickets</span></li>
          <li><span class="dot d-registro"></span><span>Registrar pagos, cambiar plan/precio, suspender/reactivar</span></li>
          <li><span class="dot d-registro"></span><span>Gestionar mensajes, tickets, anuncios y actualizaciones</span></li>
          <li><span class="dot d-mensaje"></span><span><b>No</b> puede eliminar clientes ni gestionar administradores/configuración</span></li>
        </ul></div>
      </div>
      <p class="hint" style="margin-top:12px">Permisos granulares por módulo llegarán más adelante.</p>`;
  }

  // ===== ADMINISTRADORES =====
  function renderAdmins(c){
    let h='<p class="hint">Cuentas con acceso al panel. El admin principal es el único que puede eliminar clientes definitivamente.</p><table><thead><tr><th>User ID</th><th>Rol</th></tr></thead><tbody>';
    for(const a of ST.ADMINS) h+=`<tr><td class="muted">${esc(a.user_id)}</td><td>${a.es_principal?'<span class="tag t-activa">principal</span>':'<span class="tag t-leido">operador</span>'}</td></tr>`;
    c.innerHTML=h+'</tbody></table>';
  }

  // ===== CONFIGURACIÓN · EMPRESA =====
  function renderConfigEmpresa(c){
    const cf=ST.CONFIG||{};
    c.innerHTML=`<div class="sechead"><h2>Configuración · Empresa</h2><span class="sp"></span>${ST.isPrincipal?'<button class="btn sm" id="cfgEdit">Editar</button>':''}</div>
      <p class="hint">Datos de tu empresa. El nombre aparece en los recibos PDF.</p>
      <div class="panel" style="max-width:520px"><dl class="kv">
        <dt>Nombre</dt><dd>${esc(cf.empresa_nombre||'SPES Systems')}</dd>
        <dt>Correo</dt><dd>${esc(cf.empresa_correo||'—')}</dd>
        <dt>Teléfono</dt><dd>${esc(cf.empresa_telefono||'—')}</dd>
        <dt>RFC</dt><dd>${esc(cf.empresa_rfc||'—')}</dd>
        <dt>Dirección</dt><dd>${esc(cf.empresa_direccion||'—')}</dd>
      </dl></div>`;
    if($('cfgEdit')) $('cfgEdit').addEventListener('click', async ()=>{
      const v=await formModal({title:'Datos de la empresa', fields:[
        {key:'empresa_nombre',label:'Nombre',value:cf.empresa_nombre||'SPES Systems',required:true},
        {key:'empresa_correo',label:'Correo',value:cf.empresa_correo||''},
        {key:'empresa_telefono',label:'Teléfono',value:cf.empresa_telefono||''},
        {key:'empresa_rfc',label:'RFC',value:cf.empresa_rfc||''},
        {key:'empresa_direccion',label:'Dirección',value:cf.empresa_direccion||''}
      ], submitLabel:'Guardar'});
      if(!v) return;
      const { error }=await sbc.from('config').update({empresa_nombre:v.empresa_nombre, empresa_correo:v.empresa_correo||null, empresa_telefono:v.empresa_telefono||null, empresa_rfc:(v.empresa_rfc||'').toUpperCase()||null, empresa_direccion:v.empresa_direccion||null, actualizado_at:new Date().toISOString()}).eq('id',1).select();
      if(error){ notify('No se pudo guardar: '+error.message,'error'); return; }
      await loadAll(); render();
    });
  }

  // ===== CUENTA =====
  function renderCuenta(c){
    c.innerHTML=`<div class="panel" style="max-width:480px"><h3>Tu cuenta</h3><dl class="kv">
      <dt>Correo</dt><dd>${esc(ST.email)}</dd>
      <dt>Rol</dt><dd>${ST.isPrincipal?'Administrador principal':'Administrador'}</dd>
    </dl><div style="margin-top:16px"><button class="btn" id="logout2">Cerrar sesión</button></div></div>`;
    $('logout2').addEventListener('click', cerrarSesion);
  }

  // ===== PRÓXIMAMENTE =====
  function renderSoon(c){
    c.innerHTML=`<div class="card soonbox"><div class="big">${esc(LABEL[ST.view]||'Módulo')} · próximamente</div>Este módulo está en el roadmap. Lo construiremos en las siguientes fases.</div>`;
  }
</script>
</body>
</html>
