<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SPES · Panel de Administración</title>
<style>
  :root{ color-scheme: light; --bg:#f4f4f5; --panel:#fff; --bd:#e4e4e7; --bd2:#f0f0f1; --ink:#18181b; --muted:#71717a; --faint:#a1a1aa; --accent:#000; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; background:var(--bg); color:var(--ink); }
  .hidden{ display:none !important; }
  a{ color:inherit; }
  /* LOGIN */
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--panel); border:1px solid var(--bd); border-radius:16px; }
  .loginbox{ width:100%; max-width:360px; padding:32px; text-align:center; }
  .logo{ width:48px;height:48px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:24px;margin:0 auto 14px; }
  h1{ font-size:18px; font-weight:800; }
  .muted{ color:var(--muted); font-size:13px; }
  input,select,textarea{ width:100%; padding:10px 12px; border:1px solid #d4d4d8; border-radius:9px; font-size:14px; margin-top:10px; background:#fff; font-family:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:#000; color:#fff; border:0; border-radius:9px; padding:9px 14px; font-weight:700; font-size:13px; }
  .btn:hover{ opacity:.9; } .btn.sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid #d4d4d8; }
  .btn.danger{ background:#dc2626; }
  .msg{ font-size:13px; margin-top:12px; min-height:18px; } .err{ color:#dc2626; } .ok{ color:#16a34a; }
  /* APP LAYOUT */
  #app{ display:flex; min-height:100vh; }
  aside{ width:230px; background:#0b0b0c; color:#e4e4e7; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  aside .brand{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid #27272a; position:sticky; top:0; background:#0b0b0c; }
  aside .brand .logo{ width:30px;height:30px;font-size:15px;border-radius:8px;margin:0; }
  aside .brand b{ font-size:14px; }
  nav{ padding:8px 8px 24px; }
  nav .grp{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#71717a; padding:14px 12px 6px; }
  nav a{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:8px; font-size:13px; color:#d4d4d8; text-decoration:none; cursor:pointer; }
  nav a:hover{ background:#1c1c1f; color:#fff; }
  nav a.active{ background:#fff; color:#000; font-weight:600; }
  nav a .soon{ font-size:9px; background:#27272a; color:#a1a1aa; border-radius:5px; padding:1px 5px; }
  nav a.active .soon{ background:#e4e4e7; color:#52525b; }
  .wrap{ flex:1; min-width:0; display:flex; flex-direction:column; }
  header{ background:#fff; border-bottom:1px solid var(--bd); padding:12px 22px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
  header .vt{ font-size:15px; font-weight:800; } header .sp{ margin-left:auto; }
  main{ padding:22px; max-width:1180px; width:100%; }
  /* mobile */
  #menuBtn{ display:none; }
  @media(max-width:860px){
    aside{ position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s; }
    aside.open{ transform:none; }
    #menuBtn{ display:inline-flex; }
  }
  /* COMPONENTS */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media(max-width:860px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:#fff; border:1px solid var(--bd); border-radius:13px; padding:14px; }
  .kpi .n{ font-size:24px; font-weight:800; } .kpi .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .kpi.soon{ opacity:.6; } .kpi .soontag{ font-size:9px; background:#f4f4f5; color:#71717a; border-radius:5px; padding:1px 6px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:860px){ .grid2{ grid-template-columns:1fr; } }
  .sec{ margin-bottom:18px; }
  .sechead{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .sechead h2{ font-size:15px; font-weight:800; } .sechead .sp{ margin-left:auto; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--bd); border-radius:13px; overflow:hidden; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--bd2); background:#fafafa; }
  td{ padding:9px 12px; border-bottom:1px solid #f4f4f5; vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  .tag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .t-activa{ background:#dcfce7; color:#166534; } .t-prueba{ background:#e0e7ff; color:#3730a3; }
  .t-suspendida{ background:#fee2e2; color:#991b1b; } .t-cancelada{ background:#f4f4f5; color:#52525b; } .t-none{ background:#f4f4f5; color:#52525b; }
  .t-archivado{ background:#fef3c7; color:#92400e; }
  .t-nuevo{ background:#dbeafe; color:#1e40af; } .t-leido{ background:#f4f4f5; color:#52525b; } .t-proceso{ background:#fef9c3; color:#854d0e; }
  .t-respondido{ background:#dcfce7; color:#166534; } .t-web{ background:#e0e7ff; color:#3730a3; } .t-restaurantes{ background:#ffedd5; color:#9a3412; }
  .danger{ color:#dc2626; } .warn{ color:#d97706; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .state{ padding:24px; text-align:center; color:var(--muted); }
  .hint{ font-size:12px; color:var(--muted); margin-bottom:10px; }
  .panel{ background:#fff; border:1px solid var(--bd); border-radius:13px; padding:16px; }
  .panel h3{ font-size:13px; font-weight:800; margin-bottom:10px; }
  .feed{ list-style:none; display:flex; flex-direction:column; gap:2px; }
  .feed li{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #f4f4f5; font-size:13px; }
  .feed li:last-child{ border-bottom:0; }
  .feed .dot{ width:7px;height:7px;border-radius:99px;margin-top:6px;flex-shrink:0;background:#a1a1aa; }
  .feed .d-pago{ background:#16a34a; } .feed .d-registro{ background:#2563eb; } .feed .d-mensaje{ background:#d97706; }
  .feed time{ color:var(--faint); font-size:11px; margin-left:auto; white-space:nowrap; }
  .back{ font-size:13px; color:#2563eb; cursor:pointer; display:inline-block; margin-bottom:12px; }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13px; }
  .kv dt{ color:var(--muted); } .kv dd{ font-weight:600; }
  .soonbox{ padding:40px; text-align:center; color:var(--muted); }
  .soonbox .big{ font-size:16px; font-weight:800; color:var(--ink); margin-bottom:6px; }
  #filebanner{ background:#fef2f2; color:#991b1b; border-bottom:1px solid #fecaca; padding:12px 18px; font-size:13px; text-align:center; }
  #filebanner code{ background:#fff; padding:1px 6px; border-radius:5px; border:1px solid #fecaca; }
</style>
</head>
<body>

<div id="filebanner" class="hidden">
  Abriste el panel como archivo local; así el inicio de sesión no funciona.
  Súbelo a tu sitio y ábrelo en <code>https://spessystems.com/admin.html</code>.
</div>

<!-- LOGIN -->
<div id="login">
  <div class="card loginbox">
    <div class="logo">S.</div>
    <h1>Panel de Administración</h1>
    <p class="muted">SPES Systems</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Correo" required autocomplete="username">
      <input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:14px" type="submit">Entrar</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="aside">
    <div class="brand"><span class="logo">S.</span><b>SPES · Admin</b></div>
    <nav id="nav"></nav>
  </aside>
  <div class="wrap">
    <header>
      <button class="btn ghost sm" id="menuBtn" aria-label="Menú">☰</button>
      <span class="vt" id="viewTitle">Dashboard</span>
      <span class="sp"></span>
      <span class="muted" id="who"></span>
      <button class="btn ghost sm" id="logout">Salir</button>
    </header>
    <main id="main">
      <div id="notadmin" class="card state hidden">
        Esta cuenta (<b id="na-email"></b>) no está autorizada para el panel.
        Entra con tu cuenta de administrador.
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const SB_URL='https://khpecvszzhyygqudeagr.supabase.co';
  const SB_KEY='sb_publishable_FvWr_E6vuc7Gf3GRkzh62Q_kfzmPVp8';
  const PRECIOS = { basico:349, pro:599, multisucursal:999 };

  if(location.protocol==='file:') document.getElementById('filebanner').classList.remove('hidden');

  const memStore={};
  const safeStorage={
    getItem:k=>{ try{ return window.localStorage.getItem(k); }catch(_){ return (k in memStore)?memStore[k]:null; } },
    setItem:(k,v)=>{ try{ window.localStorage.setItem(k,v); }catch(_){ memStore[k]=String(v); } },
    removeItem:k=>{ try{ window.localStorage.removeItem(k); }catch(_){ delete memStore[k]; } }
  };
  const sb = supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storage:safeStorage } });

  const $ = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => '$'+(Math.round(Number(n)||0)).toLocaleString('es-MX');
  function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function ymd(d){ return new Date(d).toISOString().slice(0,10); }
  function daysLeft(v){ if(!v) return null; return Math.ceil((new Date(v+'T00:00:00') - new Date(new Date().toDateString()))/86400000); }
  function fdate(s){ try{ return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'}); }catch(e){ return s||'—'; } }
  function fdatetime(s){ try{ return new Date(s).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s||'—'; } }
  const subOf = b => Array.isArray(b.subscriptions) ? (b.subscriptions[0]||null) : (b.subscriptions||null);
  function planPrecio(clave){ const p=ST.PLANES.find(x=>x.clave===clave); return p?Number(p.precio_mxn):(PRECIOS[clave]||0); }
  const precioDe = s => s ? (s.precio_mxn!=null ? Number(s.precio_mxn) : planPrecio(s.plan)) : 0;
  const clavesPlan = () => ST.PLANES.length ? ST.PLANES.map(p=>p.clave).join('/') : 'basico/pro/multisucursal';

  function traducirAuth(msg){
    const m=(msg||'').toLowerCase();
    if(m.includes('invalid login credentials')) return 'Correo o contraseña incorrectos.';
    if(m.includes('email not confirmed')) return 'Tu correo aún no está confirmado.';
    if(m.includes('failed to fetch')||m.includes('network')) return 'Sin conexión. Ábrelo en https://spessystems.com/admin.html';
    return msg || 'No se pudo iniciar sesión.';
  }

  // ---------- AUTH ----------
  $('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const m=$('loginMsg'); m.textContent='Entrando…'; m.className='msg';
    try{
      const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
      if(error){ m.textContent=traducirAuth(error.message); m.className='msg err'; }
    }catch(err){ m.textContent=traducirAuth(err && err.message); m.className='msg err'; }
  });
  async function cerrarSesion(){
    try{ await sb.auth.signOut({ scope:'local' }); }catch(_){ }
    try{ Object.keys(window.localStorage).filter(k=>k.indexOf('sb-')===0).forEach(k=>window.localStorage.removeItem(k)); }catch(_){ }
    showLogin();
  }
  $('logout').addEventListener('click', cerrarSesion);
  $('menuBtn').addEventListener('click', ()=> $('aside').classList.toggle('open'));

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='INITIAL_SESSION') return;
    if(!session || event==='SIGNED_OUT'){ showLogin(); return; }
    showApp(session);
  });
  (async ()=>{
    try{
      const { data } = await sb.auth.getSession();
      if(!data || !data.session){ showLogin(); return; }
      const { error } = await sb.auth.getUser();
      if(error){ await cerrarSesion(); } else { showApp(data.session); }
    }catch(_){ await cerrarSesion(); }
  })();

  function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

  // ---------- STATE ----------
  const ST = { view:'dashboard', clienteId:null, isPrincipal:false, email:'',
    NEGOCIOS:[], LEADS:[], PAGOS:[], ADMINS:[], VERSIONES:[], NOTAS:[], PLANES:[] };

  const NAV = [
    { items:[ {id:'dashboard',label:'Dashboard'} ] },
    { group:'CRM', items:[ {id:'prospectos',label:'Prospectos'},{id:'clientes',label:'Clientes'},{id:'mensajes',label:'Mensajes'},{id:'empresas',label:'Empresas',soon:1},{id:'contactos',label:'Contactos',soon:1} ] },
    { group:'Suscripciones', items:[ {id:'planes',label:'Planes'},{id:'membresias',label:'Membresías',soon:1},{id:'facturacion',label:'Facturación'},{id:'pagos',label:'Pagos'},{id:'renovaciones',label:'Renovaciones'} ] },
    { group:'Soporte', items:[ {id:'conversaciones',label:'Conversaciones',soon:1},{id:'tickets',label:'Tickets',soon:1},{id:'kb',label:'Base de conocimiento',soon:1},{id:'anuncios',label:'Anuncios',soon:1} ] },
    { group:'Productos', items:[ {id:'actualizaciones',label:'Actualizaciones'},{id:'licencias',label:'Licencias'},{id:'pf',label:'POS Frutería',soon:1},{id:'pr',label:'POS Restaurante',soon:1},{id:'pg',label:'POS Gimnasio',soon:1},{id:'hardware',label:'Hardware',soon:1} ] },
    { group:'Usuarios', items:[ {id:'administradores',label:'Administradores'},{id:'roles',label:'Roles',soon:1},{id:'permisos',label:'Permisos',soon:1} ] },
    { group:'Marketing', items:[ {id:'leads',label:'Leads'},{id:'formularios',label:'Formularios',soon:1},{id:'newsletter',label:'Newsletter',soon:1} ] },
    { group:'Analíticas', items:[ {id:'an_ventas',label:'Ventas',soon:1},{id:'an_ingresos',label:'Ingresos',soon:1},{id:'an_churn',label:'Churn',soon:1},{id:'an_conv',label:'Conversión',soon:1},{id:'an_uso',label:'Uso del sistema',soon:1} ] },
    { group:'Infraestructura', items:[ {id:'inf_estado',label:'Estado',soon:1},{id:'inf_serv',label:'Servidores',soon:1},{id:'inf_db',label:'Base de datos',soon:1},{id:'inf_backups',label:'Backups',soon:1},{id:'inf_logs',label:'Logs',soon:1} ] },
    { group:'Configuración', items:[ {id:'cfg_empresa',label:'Empresa',soon:1},{id:'cfg_branding',label:'Branding',soon:1},{id:'cfg_correos',label:'Correos',soon:1},{id:'cfg_api',label:'API',soon:1},{id:'cfg_integraciones',label:'Integraciones',soon:1} ] },
    { items:[ {id:'cuenta',label:'Cuenta'} ] }
  ];
  const LABEL = {};
  NAV.forEach(g=>g.items.forEach(it=>{ LABEL[it.id]=it.label; }));

  function renderNav(){
    let h='';
    for(const g of NAV){
      if(g.group) h+='<div class="grp">'+esc(g.group)+'</div>';
      for(const it of g.items){
        h+='<a data-view="'+it.id+'" class="'+(ST.view===it.id?'active':'')+'">'+esc(it.label)+(it.soon?'<span class="soon">pronto</span>':'')+'</a>';
      }
    }
    $('nav').innerHTML=h;
  }
  $('nav').addEventListener('click', e=>{ const a=e.target.closest('a[data-view]'); if(!a) return; go(a.dataset.view); $('aside').classList.remove('open'); });

  function go(view, clienteId){ ST.view=view; ST.clienteId=clienteId||null; renderNav(); render(); window.scrollTo(0,0); }

  // ---------- APP BOOT ----------
  async function showApp(session){
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    ST.email = session.user.email; $('who').textContent = session.user.email;
    $('na-email').textContent = session.user.email;
    let isAdmin=false;
    try{ const { data:a } = await sb.rpc('is_admin'); isAdmin=!!a; }catch(_){ }
    try{ const { data:p } = await sb.rpc('is_principal_admin'); ST.isPrincipal=!!p; }catch(_){ }
    $('notadmin').classList.toggle('hidden', isAdmin);
    $('content').classList.toggle('hidden', !isAdmin);
    $('aside').style.visibility = isAdmin?'visible':'hidden';
    if(!isAdmin) return;
    renderNav();
    await loadAll();
    render();
  }

  async function loadAll(){
    try{
      const [b,s,p,l,ad,ve,pl] = await Promise.all([
        sb.from('businesses').select('*').order('created_at',{ascending:true}),
        sb.from('subscriptions').select('*'),
        sb.from('pagos').select('*').order('created_at',{ascending:false}).limit(500),
        sb.from('leads').select('*').order('created_at',{ascending:false}).limit(500),
        sb.from('admins').select('*'),
        sb.from('versiones').select('*').order('created_at',{ascending:false}),
        sb.from('planes').select('*').order('orden',{ascending:true})
      ]);
      if(b.error) throw b.error;
      const subByB={}; (s.data||[]).forEach(x=>{ subByB[x.business_id]=x; });
      ST.NEGOCIOS=(b.data||[]).map(x=>({ ...x, subscriptions: subByB[x.id]?[subByB[x.id]]:[] }));
      ST.PAGOS=p.data||[]; ST.LEADS=l.data||[]; ST.ADMINS=ad.data||[]; ST.VERSIONES=ve.data||[]; ST.PLANES=pl.data||[];
    }catch(e){ $('content').innerHTML='<div class="card state" style="color:#dc2626">Error al cargar: '+esc(e.message||String(e))+'</div>'; throw e; }
  }
  const nameOf = bid => { const b=ST.NEGOCIOS.find(x=>x.id===bid); return b?(b.business_name||'(sin nombre)'):'—'; };

  // ---------- ROUTER ----------
  function render(){
    $('viewTitle').textContent = ST.view==='cliente' ? 'Ficha de cliente' : (LABEL[ST.view]||'Dashboard');
    const c=$('content');
    switch(ST.view){
      case 'dashboard': return renderDashboard(c);
      case 'clientes': return renderClientes(c,false);
      case 'cliente': return renderFicha(c);
      case 'mensajes': return renderMensajes(c,'todos');
      case 'prospectos': return renderMensajes(c,'prospectos');
      case 'leads': return renderMensajes(c,'todos');
      case 'planes': return renderPlanes(c);
      case 'facturacion': return renderFacturacion(c);
      case 'pagos': return renderPagos(c);
      case 'renovaciones': return renderRenovaciones(c);
      case 'actualizaciones': return renderActualizaciones(c);
      case 'licencias': return renderLicencias(c);
      case 'administradores': return renderAdmins(c);
      case 'cuenta': return renderCuenta(c);
      default: return renderSoon(c);
    }
  }

  // ---------- DASHBOARD ----------
  function metrics(){
    let activas=0,prueba=0,susp=0,arch=0,mrr=0,nuevos=0;
    const hoy=new Date();
    for(const b of ST.NEGOCIOS){
      if(b.archivado){ arch++; continue; }
      const s=subOf(b); const dl=s?daysLeft(s.vence):null;
      if(s){
        if(s.estado==='activa'){ activas++; mrr+=precioDe(s); }
        else if(s.estado==='prueba'){ prueba++; }
        if(s.estado==='suspendida' || (dl!=null && dl<0 && s.estado!=='cancelada')) susp++;
      }
      if(b.created_at && (hoy-new Date(b.created_at))/86400000<=30) nuevos++;
    }
    return { activas,prueba,susp,arch,mrr,arr:mrr*12,nuevos };
  }
  function actividadFeed(){
    const f=[];
    ST.NEGOCIOS.forEach(b=>{ if(b.created_at) f.push({t:b.created_at,tipo:'registro',txt:'Nuevo registro · '+(b.business_name||'(sin nombre)')}); });
    ST.PAGOS.forEach(p=>{ f.push({t:p.created_at,tipo:'pago',txt:'Pago '+money(p.monto)+' · '+nameOf(p.business_id)}); });
    ST.LEADS.forEach(l=>{ f.push({t:l.created_at,tipo:'mensaje',txt:'Mensaje de '+(l.nombre||'—')+(l.negocio?' ('+l.negocio+')':'')}); });
    return f.filter(x=>x.t).sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,12);
  }
  function renderDashboard(c){
    const m=metrics();
    const renov = ST.NEGOCIOS.map(subOf).filter(s=>s && ['activa','prueba'].includes(s.estado)).map(s=>({s,dl:daysLeft(s.vence)}))
      .filter(x=>x.dl!=null && x.dl>=0 && x.dl<=14).sort((a,b)=>a.dl-b.dl);
    const feed=actividadFeed();
    const ultPagos=ST.PAGOS.slice(0,6), ultReg=ST.NEGOCIOS.slice().reverse().slice(0,6), ultMsg=ST.LEADS.slice(0,6);
    c.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="n">${m.activas}</div><div class="l">Clientes activos</div></div>
        <div class="kpi"><div class="n">${m.prueba}</div><div class="l">En prueba</div></div>
        <div class="kpi"><div class="n danger">${m.susp}</div><div class="l">Suspendidos / vencidos</div></div>

  // ---------- CLIENTES ----------
  function estadoTag(b){
    if(b.archivado) return '<span class="tag t-archivado">archivado</span>';
    const s=subOf(b); if(!s) return '<span class="tag t-none">sin suscripción</span>';
    const dl=daysLeft(s.vence);
    if(s.estado==='activa' && dl!=null && dl<0) return '<span class="tag t-suspendida">vencida</span>';
    return '<span class="tag t-'+esc(s.estado)+'">'+esc(s.estado)+'</span>';
  }
  function renderClientes(c){
    const negs=ST.NEGOCIOS;
    const activos=negs.filter(b=>!b.archivado), arch=negs.filter(b=>b.archivado);
    function tabla(list){
      if(!list.length) return '<div class="card state">Nada por aquí.</div>';
      let h='<table><thead><tr><th>Negocio</th><th>Plan</th><th>Estado</th><th>Precio</th><th>Vence</th><th></th></tr></thead><tbody>';
      for(const b of list){
        const s=subOf(b), dl=s?daysLeft(s.vence):null;
        h+=`<tr>
          <td><strong>${esc(b.business_name||'(sin nombre)')}</strong>${b.owner_nombre?'<br><span class="muted">'+esc(b.owner_nombre)+'</span>':''}</td>
          <td>${s?esc(s.plan):'—'}</td>
          <td>${estadoTag(b)}${(s&&dl!=null&&dl>=0&&dl<=7&&!b.archivado)?' <span class="warn" style="font-size:11px">'+dl+' d</span>':''}</td>
          <td>${s?money(precioDe(s))+'<span class="muted" style="font-size:11px">/mes</span>':'—'}</td>
          <td>${s?fdate(s.vence):'—'}</td>
          <td style="text-align:right"><button class="btn sm" data-ficha="${b.id}">Ver perfil ›</button></td>
        </tr>`;
      }
      return h+'</tbody></table>';
    }
    c.innerHTML = `
      <div class="sec"><div class="sechead"><h2>Clientes activos (${activos.length})</h2></div>
      <p class="hint">Los negocios aparecen al crear su cuenta en el POS. Entra a "Ver perfil" para todas las acciones.</p>${tabla(activos)}</div>
      ${arch.length?'<div class="sec"><div class="sechead"><h2>Archivados ('+arch.length+')</h2></div>'+tabla(arch)+'</div>':''}`;
    c.querySelectorAll('[data-ficha]').forEach(btn=>btn.addEventListener('click',()=>go('cliente',btn.dataset.ficha)));
  }

  // ---------- FICHA ----------
  function renderFicha(c){

    const notas=ST.NOTAS.filter(n=>n.business_id===b.id);

      <div class="sechead"><h2>${esc(b.business_name||'(sin nombre)')}</h2> ${estadoTag(b)}</div>

        ${A('precio','Cambiar precio')}
        ${A('extender','Extender licencia')}

      <div class="grid2">
        <div class="panel"><h3>Información</h3><dl class="kv">
          <dt>Negocio</dt><dd>${esc(b.business_name||'—')}</dd>
          <dt>Propietario</dt><dd>${esc(b.owner_nombre||'—')}</dd>
          <dt>Teléfono</dt><dd>${esc(b.owner_telefono||'—')}</dd>
          <dt>Correo</dt><dd>${esc(b.owner_email||'—')}</dd>
          <dt>Ciudad</dt><dd>${esc(b.ciudad||'—')}</dd>
          <dt>Registrado</dt><dd>${fdate(b.created_at)}</dd>
        </dl></div>
        <div class="panel"><h3>Suscripción / Licencia</h3><dl class="kv">
          <dt>Plan</dt><dd>${s?esc(s.plan):'—'}</dd>
          <dt>Estado</dt><dd>${s?esc(s.estado):'sin suscripción'}</dd>
          <dt>Precio</dt><dd>${s?money(precioDe(s))+'/mes'+(s.precio_mxn!=null?' (personalizado)':''):'—'}</dd>

        </dl></div>
        <div class="panel"><h3>Historial de pagos (${pagos.length})</h3>
          ${pagos.length?'<ul class="feed">'+pagos.map(p=>`<li><span class="dot d-pago"></span><span>${money(p.monto)} · ${esc(p.metodo||'—')}${p.nota?' · '+esc(p.nota):''}</span><time>${fdate(p.created_at)}</time></li>`).join('')+'</ul>':'<p class="muted">Sin pagos.</p>'}
        </div>
        <div class="panel"><h3>Notas internas</h3>
          <div id="notasList">${notas.length?'<ul class="feed">'+notas.map(n=>`<li><span class="dot"></span><span>${esc(n.texto)}</span><time>${fdate(n.created_at)}</time></li>`).join('')+'</ul>':'<p class="muted">Sin notas.</p>'}</div>
          <div style="display:flex;gap:8px;margin-top:10px"><input id="notaTxt" placeholder="Agregar nota…" style="margin:0"><button class="btn sm" id="notaAdd">Agregar</button></div>
        </div>
        <div class="panel soonbox" style="grid-column:1/-1"><div class="big">Dispositivos · Sucursales · Respaldos · Tickets</div>Se conectan cuando el POS sincronice en la nube y exista el módulo de soporte (Fases 4–5).</div>
      </div>`;
    $('back').addEventListener('click',()=>go('clientes'));
    c.querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>accionCliente(btn.dataset.act,b)));
    $('notaAdd').addEventListener('click', async ()=>{
      const t=$('notaTxt').value.trim(); if(!t) return;
      const { error }=await sb.from('notas_cliente').insert({business_id:b.id, texto:t, autor:ST.email});
      if(error){ alert('No se pudo guardar la nota: '+error.message); return; }
      await loadNotas(); render();
    });
  }
  async function loadNotas(){ const { data }=await sb.from('notas_cliente').select('*').order('created_at',{ascending:false}); ST.NOTAS=data||[]; }

  async function accionCliente(act,b){
    const s=subOf(b);
    try{
      if(act==='pago') return registrarPago(b);
      if(act==='plan'){
        const v=(prompt('Nuevo plan ('+clavesPlan()+'):', s?s.plan:'basico')||'').toLowerCase();
        if(!(ST.PLANES.some(p=>p.clave===v)||PRECIOS[v])) return; await updSub(b,{plan:v}); }
      else if(act==='precio'){
        const cur=s&&s.precio_mxn!=null?s.precio_mxn:(s?PRECIOS[s.plan]:0);
        const v=prompt('Precio personalizado en MXN/mes (vacío = precio de lista):', cur);
        if(v===null) return; const num=v.trim()===''?null:Number(v); if(v.trim()!==''&&!(num>=0)) return alert('Número inválido');
        await updSub(b,{precio_mxn:num}); }
      else if(act==='extender'){
        const d=parseInt(prompt('¿Cuántos días extender la licencia?','30')); if(!d) return;
        const base=(s&&s.vence&&new Date(s.vence)>new Date())?new Date(s.vence):new Date();
        await updSub(b,{vence:ymd(addDays(base,d)), estado:'activa'}); }
      else if(act==='prueba'){
        if(!confirm('¿Reiniciar prueba de 14 días?')) return;
        await updSub(b,{estado:'prueba', vence:ymd(addDays(new Date(),14))}); }
      else if(act==='suspender'){ if(!confirm('¿Suspender? El POS le pedirá renovar.')) return; await updSub(b,{estado:'suspendida'}); }
      else if(act==='reactivar'){ await updSub(b,{estado:'activa'}); }
      else if(act==='editar'){
        const nn=prompt('Nombre del negocio:', b.business_name||''); if(nn===null) return;
        const on=prompt('Propietario:', b.owner_nombre||'')||null;
        const ot=prompt('Teléfono:', b.owner_telefono||'')||null;
        const oe=prompt('Correo:', b.owner_email||'')||null;
        const oc=prompt('Ciudad:', b.ciudad||'')||null;
        const { error }=await sb.from('businesses').update({business_name:nn, owner_nombre:on, owner_telefono:ot, owner_email:oe, ciudad:oc}).eq('id',b.id).select();
        if(error) return alert('No se pudo editar: '+error.message); }
      else if(act==='archivar'){ if(!confirm('¿Archivar este cliente? (no se borra)')) return; await updBiz(b,{archivado:true}); }
      else if(act==='desarchivar'){ await updBiz(b,{archivado:false}); }
      else if(act==='eliminar'){
        if(!ST.isPrincipal) return alert('Solo el administrador principal puede eliminar.');
        if(!confirm('ELIMINAR DEFINITIVAMENTE a '+(b.business_name||'')+'? Esto no se puede deshacer.')) return;
        if(prompt('Escribe ELIMINAR para confirmar:')!=='ELIMINAR') return;
        const { error }=await sb.from('businesses').delete().eq('id',b.id);
        if(error) return alert('No se pudo eliminar: '+error.message);
        await loadAll(); return go('clientes'); }
      await loadAll();
      if(act==='archivar'||act==='eliminar') go('clientes'); else render();
    }catch(e){ alert('Error: '+(e.message||e)); }
  }
  async function updSub(b,patch){
    patch.updated_at=new Date().toISOString();
    const { data,error }=await sb.from('subscriptions').update(patch).eq('business_id',b.id).select();
    if(error) throw error;
    if(!data||!data.length) alert('No cambió la suscripción (¿este negocio no tiene una?).');
  }
  async function updBiz(b,patch){ const { error }=await sb.from('businesses').update(patch).eq('id',b.id).select(); if(error) throw error; }

  async function registrarPago(b){
    const s=subOf(b);
    let plan = s?s.plan:'basico';
    const planIn=(prompt('Plan ('+clavesPlan()+'):', plan)||plan).toLowerCase();
    if(ST.PLANES.some(p=>p.clave===planIn)||PRECIOS[planIn]) plan=planIn;
    const meses=parseInt(prompt('¿Cuántos meses paga?','1')); if(!meses||meses<1) return;
    const metodo=(prompt('Método: transferencia / efectivo / mercadopago','transferencia')||'otro').toLowerCase();
    const m=['transferencia','efectivo','mercadopago'].includes(metodo)?metodo:'otro';
    const precioMes = s&&s.precio_mxn!=null?Number(s.precio_mxn):planPrecio(plan);
    const base=(s && s.vence && new Date(s.vence)>new Date())?new Date(s.vence):new Date();
    const cubre=ymd(addMonths(base,meses));
    const monto=precioMes*meses;
    const p=await sb.from('pagos').insert({business_id:b.id, monto, metodo:m, cubre_hasta:cubre, nota:meses+' mes(es) · '+plan});
    if(p.error){ alert('No se pudo registrar el pago: '+p.error.message); return; }
    await updSub(b,{plan, estado:'activa', vence:cubre});
    await loadAll(); render();
  }

  // ---------- MENSAJES / CRM ----------
  const EST_MSG=['nuevo','leido','en proceso','respondido','archivado'];

    if(!list.length){ c.innerHTML='<div class="card state">Sin mensajes'+(mode==='prospectos'?' en seguimiento':'')+'.</div>'; return; }
    let h=`<p class="hint">${mode==='prospectos'?'Mensajes que estás trabajando (leídos / en proceso).':'Mensajes del sitio convertidos en mini-CRM: cámbiales el estado, asigna responsable y agrega notas.'}</p>
      <table><thead><tr><th>Contacto</th><th>Mensaje</th><th>Estado</th><th>Responsable</th><th>Fecha</th><th></th></tr></thead><tbody>`;
    for(const l of list){
      h+=`<tr>
        <td><strong>${esc(l.nombre||'—')}</strong><br><span class="muted">${esc(l.correo||'')}${l.negocio?' · '+esc(l.negocio):''}</span></td>
        <td style="max-width:260px">${esc(l.mensaje||'—')}</td>
        <td>${msgTag(l.estado)}</td>
        <td>${esc(l.responsable||'—')}${l.notas?'<br><span class="muted" style="font-size:11px">📝 '+esc(String(l.notas).slice(0,40))+'</span>':''}</td>
        <td class="muted">${fdate(l.created_at)}</td>
        <td><div class="row-actions">
          <select data-est="${l.id}" style="margin:0;width:auto;padding:5px 8px;font-size:12px">${EST_MSG.map(e=>`<option ${l.estado===e?'selected':''}>${e}</option>`).join('')}</select>
          <button class="btn sm ghost" data-resp="${l.id}">Responsable</button>
          <button class="btn sm ghost" data-nota="${l.id}">Nota</button>
        </div></td>
      </tr>`;
    }
    c.innerHTML=h+'</tbody></table>';
    c.querySelectorAll('[data-est]').forEach(sel=>sel.addEventListener('change', async ()=>{ await updLead(sel.dataset.est,{estado:sel.value}); }));
    c.querySelectorAll('[data-resp]').forEach(btn=>btn.addEventListener('click', async ()=>{ const l=ST.LEADS.find(x=>x.id===btn.dataset.resp); const v=prompt('Responsable:', l.responsable||ST.email); if(v===null) return; await updLead(btn.dataset.resp,{responsable:v}); }));
    c.querySelectorAll('[data-nota]').forEach(btn=>btn.addEventListener('click', async ()=>{ const l=ST.LEADS.find(x=>x.id===btn.dataset.nota); const v=prompt('Nota interna:', l.notas||''); if(v===null) return; await updLead(btn.dataset.nota,{notas:v}); }));
  }
  async function updLead(id,patch){
    const { data,error }=await sb.from('leads').update(patch).eq('id',id).select();
    if(error){ alert('No se pudo actualizar: '+error.message); return; }
    const i=ST.LEADS.findIndex(x=>x.id===id); if(i>=0&&data&&data[0]) ST.LEADS[i]=data[0];
    render();
  }

  // ---------- PLANES (Fase 3) ----------
  function renderPlanes(c){
    let h=`<div class="sechead"><h2>Planes</h2><span class="sp"></span><button class="btn sm" id="newPlan">Nuevo plan</button></div>
      <p class="hint">Estos precios se usan en los KPIs, los pagos y deben coincidir con la web. Editar aquí actualiza todo el panel.</p>`;

    else { h+='<table><thead><tr><th>Clave</th><th>Nombre</th><th>Precio</th><th>Periodo</th><th>Activo</th><th></th></tr></thead><tbody>';
      for(const p of ST.PLANES) h+=`<tr><td><code>${esc(p.clave)}</code></td><td>${esc(p.nombre)}</td><td><strong>${money(p.precio_mxn)}</strong></td><td>${esc(p.periodo)}</td><td>${p.activo?'<span class="tag t-activa">sí</span>':'<span class="tag t-none">no</span>'}</td><td style="text-align:right"><div class="row-actions" style="justify-content:flex-end"><button class="btn sm ghost" data-editp="${p.id}">Editar</button><button class="btn sm ghost" data-togp="${p.id}">${p.activo?'Desactivar':'Activar'}</button></div></td></tr>`;

      const nombre=prompt('Nombre visible:', clave)||clave;

      const { error }=await sb.from('planes').insert({clave,nombre,precio_mxn:precio,orden:ST.PLANES.length+1});
      if(error){ alert('No se pudo crear: '+error.message); return; }
      await loadAll(); render();
    });
    c.querySelectorAll('[data-editp]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const p=ST.PLANES.find(x=>x.id===btn.dataset.editp);
      const nombre=prompt('Nombre:', p.nombre)||p.nombre;
      const precio=Number(prompt('Precio MXN/mes:', p.precio_mxn)); if(!(precio>=0)) return;
      const { error }=await sb.from('planes').update({nombre,precio_mxn:precio}).eq('id',p.id).select();
      if(error){ alert('No se pudo actualizar: '+error.message); return; }
      await loadAll(); render();

    c.querySelectorAll('[data-togp]').forEach(btn=>btn.addEventListener('click', async ()=>{

      await loadAll(); render();

  }

  // ---------- FACTURACIÓN (Fase 3: PDF ahora, CFDI después) ----------
  function renderFacturacion(c){
    const list=ST.NEGOCIOS.filter(b=>!b.archivado);
    let h=`<p class="hint">Datos fiscales para recibos (y CFDI a futuro). Los recibos PDF se descargan desde "Pagos".</p>
      <table><thead><tr><th>Negocio</th><th>Razón social</th><th>RFC</th><th>Estado</th><th></th></tr></thead><tbody>`;
    for(const b of list) h+=`<tr><td><strong>${esc(b.business_name||'—')}</strong></td><td>${esc(b.razon_social||'—')}</td><td>${esc(b.rfc||'—')}</td><td>${b.rfc?'<span class="tag t-activa">completo</span>':'<span class="tag t-none">pendiente</span>'}</td><td style="text-align:right"><button class="btn sm ghost" data-fisc="${b.id}">Editar fiscal</button></td></tr>`;
    c.innerHTML=h+'</tbody></table>';
    c.querySelectorAll('[data-fisc]').forEach(btn=>btn.addEventListener('click',()=>editarFiscal(btn.dataset.fisc)));

  async function editarFiscal(bid){
    const b=ST.NEGOCIOS.find(x=>x.id===bid); if(!b) return;
    const razon=prompt('Razón social:', b.razon_social||''); if(razon===null) return;
    const rfc=(prompt('RFC:', b.rfc||'')||'').toUpperCase().trim()||null;
    const regimen=prompt('Régimen fiscal (opcional):', b.regimen_fiscal||'')||null;
    const cp=prompt('Código postal fiscal:', b.cp_fiscal||'')||null;
    const uso=prompt('Uso de CFDI (opcional, ej. G03):', b.uso_cfdi||'')||null;
    const { error }=await sb.from('businesses').update({razon_social:razon||null, rfc, regimen_fiscal:regimen, cp_fiscal:cp, uso_cfdi:uso}).eq('id',bid).select();
    if(error){ alert('No se pudo guardar: '+error.message); return; }
    await loadAll(); render();
  }

  // ---------- RECIBO PDF ----------
  function genRecibo(pid){
    const p=ST.PAGOS.find(x=>x.id===pid); if(!p) return;
    if(!window.jspdf){ alert('No se pudo cargar el generador de PDF.'); return; }
    const b=ST.NEGOCIOS.find(x=>x.id===p.business_id)||{};
    const { jsPDF }=window.jspdf; const doc=new jsPDF();
    doc.setFontSize(20); doc.text('SPES Systems',20,22);
    doc.setFontSize(10); doc.setTextColor(120); doc.text('spessystems.com · Recibo de pago',20,28); doc.setTextColor(0);
    const folio='REC-'+String(p.id).slice(0,8).toUpperCase();
    let y=46; doc.setFontSize(11);
    const line=(k,v)=>{ doc.setTextColor(120); doc.text(k,20,y); doc.setTextColor(0); doc.text(String(v||'—'),75,y); y+=8; };
    line('Folio',folio); line('Fecha',fdate(p.created_at)); line('Cliente',b.business_name||'—');
    if(b.razon_social) line('Razón social',b.razon_social);
    if(b.rfc) line('RFC',b.rfc);
    line('Concepto',p.nota||'Suscripción SPES'); line('Método',p.metodo||'—');
    line('Cubre hasta',p.cubre_hasta?fdate(p.cubre_hasta):'—');
    y+=4; doc.setDrawColor(220); doc.line(20,y,190,y); y+=12;
    doc.setFontSize(15); doc.text('Total: '+money(p.monto),20,y);
    y+=18; doc.setFontSize(9); doc.setTextColor(140);
    doc.text('Comprobante de pago, no es una factura fiscal (CFDI).',20,y);
    doc.save(folio+'.pdf');
  }

  // ---------- PAGOS ----------
  function renderPagos(c){
    if(!ST.PAGOS.length){ c.innerHTML='<div class="card state">Aún no hay pagos registrados. Regístralos desde la ficha de cada cliente.</div>'; return; }
    let h='<table><thead><tr><th>Negocio</th><th>Monto</th><th>Método</th><th>Cubre hasta</th><th>Nota</th><th>Fecha</th><th></th></tr></thead><tbody>';
    for(const p of ST.PAGOS) h+=`<tr><td>${esc(nameOf(p.business_id))}</td><td><strong>${money(p.monto)}</strong></td><td>${esc(p.metodo||'—')}</td><td>${p.cubre_hasta?fdate(p.cubre_hasta):'—'}</td><td class="muted">${esc(p.nota||'—')}</td><td class="muted">${fdate(p.created_at)}</td><td style="text-align:right"><button class="btn sm ghost" data-recibo="${p.id}">Recibo PDF</button></td></tr>`;
    c.innerHTML=h+'</tbody></table>';
    c.querySelectorAll('[data-recibo]').forEach(btn=>btn.addEventListener('click',()=>genRecibo(btn.dataset.recibo)));
  }

  // ---------- RENOVACIONES ----------
  function renderRenovaciones(c){
    const list=ST.NEGOCIOS.filter(b=>!b.archivado).map(b=>({b,s:subOf(b)})).filter(x=>x.s && ['activa','prueba'].includes(x.s.estado))
      .map(x=>({...x,dl:daysLeft(x.s.vence)})).filter(x=>x.dl!=null).sort((a,b)=>a.dl-b.dl);
    if(!list.length){ c.innerHTML='<div class="card state">Sin suscripciones activas.</div>'; return; }
    let h='<p class="hint">Ordenado por urgencia. Rojo = vencida; ámbar = vence en ≤7 días.</p><table><thead><tr><th>Negocio</th><th>Plan</th><th>Vence</th><th>Días</th><th></th></tr></thead><tbody>';
    for(const x of list){
      const cls=x.dl<0?'danger':(x.dl<=7?'warn':'');
      h+=`<tr><td>${esc(x.b.business_name||'(sin nombre)')}</td><td>${esc(x.s.plan)}</td><td>${fdate(x.s.vence)}</td><td class="${cls}">${x.dl<0?'vencida':x.dl+' d'}</td><td style="text-align:right"><button class="btn sm" data-ficha="${x.b.id}">Ver perfil ›</button></td></tr>`;
    }
    c.innerHTML=h+'</tbody></table>';
    c.querySelectorAll('[data-ficha]').forEach(btn=>btn.addEventListener('click',()=>go('cliente',btn.dataset.ficha)));
  }

  // ---------- LICENCIAS ----------
  function renderLicencias(c){
    const list=ST.NEGOCIOS.filter(b=>!b.archivado).map(b=>({b,s:subOf(b)}));
    let h='<p class="hint">Estado de licencia por negocio (igual que valida el POS al iniciar sesión).</p><table><thead><tr><th>Negocio</th><th>Plan</th><th>Estado</th><th>Vence</th></tr></thead><tbody>';
    for(const x of list) h+=`<tr><td>${esc(x.b.business_name||'(sin nombre)')}</td><td>${x.s?esc(x.s.plan):'—'}</td><td>${estadoTag(x.b)}</td><td>${x.s?fdate(x.s.vence):'—'}</td></tr>`;
    c.innerHTML=h+'</tbody></table>';
  }

  // ---------- ACTUALIZACIONES (Fase 2) ----------
  function renderActualizaciones(c){
    let h=`<div class="sechead"><h2>Centro de actualizaciones</h2><span class="sp"></span><button class="btn sm" id="newVer">Publicar versión</button></div>
      <p class="hint">Publica notas de versión. El POS las detecta y avisa al cliente que hay una nueva versión.</p>`;
    if(!ST.VERSIONES.length) h+='<div class="card state">Aún no hay versiones publicadas.</div>';
    else { h+='<div style="display:flex;flex-direction:column;gap:12px">';
      for(const v of ST.VERSIONES){
        h+=`<div class="panel"><div style="display:flex;align-items:center;gap:10px">
          <h3 style="margin:0">v${esc(v.version)}${v.titulo?' · '+esc(v.titulo):''}</h3>
          ${v.publicada?'<span class="tag t-activa">publicada</span>':'<span class="tag t-none">borrador</span>'}
          ${v.obligatoria?'<span class="tag t-suspendida">obligatoria</span>':''}
          <span class="sp" style="margin-left:auto"></span><span class="muted" style="font-size:12px">${fdate(v.created_at)}</span>
          <button class="btn sm ghost" data-delver="${v.id}">Borrar</button></div>
          ${v.cambios?'<ul class="feed" style="margin-top:8px">'+String(v.cambios).split('\n').filter(x=>x.trim()).map(x=>`<li><span class="dot d-pago"></span><span>${esc(x.replace(/^[-*✓\s]+/,''))}</span></li>`).join('')+'</ul>':''}
        </div>`;
      }
      h+='</div>'; }
    c.innerHTML=h;
    $('newVer').addEventListener('click', async ()=>{
      const version=prompt('Número de versión (ej. 1.2.0):',''); if(!version) return;
      const titulo=prompt('Título (opcional):','')||null;
      const cambios=prompt('Cambios (uno por línea):','✓ ')||'';
      const obligatoria=confirm('¿Es una actualización obligatoria? (Aceptar = sí)');
      const { error }=await sb.from('versiones').insert({version, titulo, cambios, obligatoria, publicada:true});
      if(error){ alert('No se pudo publicar: '+error.message); return; }
      await loadAll(); render();
    });
    c.querySelectorAll('[data-delver]').forEach(btn=>btn.addEventListener('click', async ()=>{
      if(!confirm('¿Borrar esta versión?')) return;
      const { error }=await sb.from('versiones').delete().eq('id',btn.dataset.delver);
      if(error){ alert('No se pudo borrar: '+error.message); return; }
      await loadAll(); render();
    }));
  }

  // ---------- ADMINISTRADORES ----------
  function renderAdmins(c){
    let h='<p class="hint">Cuentas con acceso al panel. El admin principal es el único que puede eliminar clientes definitivamente.</p><table><thead><tr><th>User ID</th><th>Rol</th></tr></thead><tbody>';
    for(const a of ST.ADMINS) h+=`<tr><td class="muted">${esc(a.user_id)}</td><td>${a.es_principal?'<span class="tag t-activa">principal</span>':'<span class="tag t-leido">operador</span>'}</td></tr>`;
    c.innerHTML=h+'</tbody></table>';
  }

  // ---------- CUENTA ----------
  function renderCuenta(c){
    c.innerHTML=`<div class="panel" style="max-width:480px"><h3>Tu cuenta</h3><dl class="kv">
      <dt>Correo</dt><dd>${esc(ST.email)}</dd>
      <dt>Rol</dt><dd>${ST.isPrincipal?'Administrador principal':'Administrador'}</dd>
    </dl><div style="margin-top:16px"><button class="btn" id="logout2">Cerrar sesión</button></div></div>`;
    $('logout2').addEventListener('click', cerrarSesion);
  }

  // ---------- PRÓXIMAMENTE ----------
  function renderSoon(c){
    c.innerHTML=`<div class="card soonbox"><div class="big">${esc(LABEL[ST.view]||'Módulo')} · próximamente</div>Este módulo está en el roadmap. Lo construiremos en las siguientes fases.</div>`;
  }

  // notas: cargar al entrar a una ficha por primera vez
  document.addEventListener('visibilitychange',()=>{});
  (async ()=>{ /* precarga notas cuando haya sesión admin */ })();
  const _origGo=go;
  window.go=go;
  // cargar notas al abrir ficha
  const _render=render;
  render=function(){ if(ST.view==='cliente' && !ST.NOTAS.length){ loadNotas().then(()=>_render()); } _render(); };
</script>
</body>
</html>
