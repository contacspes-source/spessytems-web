<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SPES · Portal del cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="/assets/spes-logo.jpeg">
<!-- Rediseño minimalista (Fase 3): el CSS heredado pre-Design-System se eliminó.
     spes-ui.css (tema dark) es la ÚNICA fuente de verdad visual; abajo solo van overrides del portal. -->
<link rel="stylesheet" href="/spes-ui.css">
<style>
  /* ===== Portal — overrides sobre el Design System (cargados DESPUÉS para ganar) ===== */

  /* Marca: la "S." oficial (assets/spes-logo.jpeg) */
  .brandimg{ width:26px; height:26px; border-radius:7px; object-fit:cover; flex-shrink:0; display:block; }
  .brandimg.lg{ width:60px; height:60px; border-radius:15px; margin:0 auto 16px; box-shadow:0 10px 24px -8px rgba(0,0,0,.6); }
  .spes-brand .btxt{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
  .spes-brand .btxt b{ font-size:13.5px; }
  .spes-brand .btxt small{ font-size:10.5px; color:var(--sidebar-muted); font-weight:500; white-space:nowrap; }
  .spes-sidebar.collapsed .spes-brand .btxt{ display:none; }

  /* Login minimalista (dark) */
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .loginbox{ width:100%; max-width:360px; padding:38px 32px 30px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
  .loginbox h1{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .loginbox .muted{ margin-top:2px; }
  .loginbox input{ margin-top:10px; text-align:left; }
  .msg{ font-size:13px; margin-top:12px; min-height:18px; } .err{ color:var(--bad-fg); } .ok{ color:var(--ok-fg); }
  #menuBtn{ display:none; } @media(max-width:900px){ #menuBtn{ display:inline-flex; } }

  /* Contenido: KPIs del portal usan .card .n/.l */
  .spes-main h2{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  @media(max-width:760px){ .cards{ grid-template-columns:1fr; } }
  .card{ padding:18px; }
  .card .n{ font-size:24px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .card .l{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  td, .card .n{ font-variant-numeric:tabular-nums; }
  .item{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:15px; margin-bottom:10px; }
  .item h3{ font-size:15px; font-weight:700; }
  .item .meta{ font-size:12px; color:var(--faint); margin-top:2px; }
  .thread .m{ padding:10px 0; border-bottom:1px solid var(--border); }
  .thread .who{ font-size:12px; color:var(--muted); margin-bottom:3px; }

  /* Dark: el modal y los <option> necesitan fondo sólido (var(--surface) es translúcido) */
  [data-theme="dark"] .modal{ background:#0c0c0d; }
  [data-theme="dark"] select option{ background:#111; }
  /* ===== Temas del portal (como la app: Blanco / Gris / Oscuro) =====
     Blanco = :root de spes-ui.css. Oscuro = [data-theme=dark]. Gris (slate
     suave, paleta del tema 'gray' de la app) se define aqui. */
  [data-theme="gray"]{
    --bg:#e7eaee; --surface:#f6f8fa; --surface-2:#eff1f4; --surface-hover:#e2e6eb;
    --border:#d6dae0; --border-strong:#c2c8d0; --text:#1c2026; --muted:#5e646e; --faint:#8a919c;
    --primary:#2a3038; --primary-hover:#1c2026; --primary-contrast:#ffffff; --focus:#2563eb;
    --sidebar-bg:#232830; --sidebar-text:#c6ccd6; --sidebar-muted:#828b99; --sidebar-hover:#2d333d;
    --sidebar-active-bg:#ffffff; --sidebar-active-text:#1c2026;
    --ok-bg:#e2f2e8; --ok-fg:#1a7f45; --warn-bg:#f8eed9; --warn-fg:#a8620a;
    --bad-bg:#f9e4e4; --bad-fg:#b42020; --info-bg:#e2eafc; --info-fg:#2952cc;
    --neutral-bg:#e6e9ed; --neutral-fg:#5e646e;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  }
  /* Selector de tema (Configuracion) */
  .themeopt{ display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); cursor:pointer; width:100%; text-align:left; color:var(--text); font-family:inherit; font-size:14px; }
  .themeopt:hover{ background:var(--surface-hover); }
  .themeopt.on{ border-color:var(--focus); box-shadow:0 0 0 1px var(--focus); }
  .themeopt .sw{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border-strong); flex-shrink:0; }
  /* ===== Reportes v4: tabs, iconos, calendario SPES, tooltip de grafica ===== */
  .ic{ width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--text); cursor:pointer; flex-shrink:0; }
  .ic:hover{ background:var(--surface-hover); }
  .rtabs{ display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .rtab{ padding:8px 12px; font-size:13.5px; font-weight:600; color:var(--muted); border:0; background:transparent; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit; }
  .rtab:hover{ color:var(--text); }
  .rtab.on{ color:var(--text); border-bottom-color:var(--primary); }
  .cal{ position:absolute; left:0; top:calc(100% + 6px); z-index:40; width:286px; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-pop); padding:12px; }
  [data-theme="dark"] .cal{ background:#141415; }
  .cal .chd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal .chd b{ font-size:13.5px; text-transform:capitalize; }
  .cal .cnav{ width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:14px; }
  .cal .cnav:hover{ background:var(--surface-hover); }
  .cal .cgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal .dow{ font-size:10px; color:var(--faint); text-align:center; padding:2px 0; }
  .cal .day{ height:30px; border:0; border-radius:7px; background:transparent; color:var(--text); font-size:12.5px; cursor:pointer; font-family:inherit; padding:0; }
  .cal .day:hover{ background:var(--surface-hover); }
  .cal .day.out{ color:var(--faint); opacity:.45; }
  .cal .day.in{ background:var(--neutral-bg); border-radius:0; }
  .cal .day.a{ background:var(--primary); color:var(--primary-contrast); border-radius:7px 0 0 7px; }
  .cal .day.b{ background:var(--primary); color:var(--primary-contrast); border-radius:0 7px 7px 0; }
  .cal .day.ab{ background:var(--primary); color:var(--primary-contrast); border-radius:7px; }
  .rtip{ position:fixed; z-index:60; pointer-events:none; background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:8px 11px; font-size:12px; box-shadow:var(--shadow-md); display:none; min-width:150px; }
  [data-theme="dark"] .rtip{ background:#161617; }
</style>
<script>
  /* Tema guardado ANTES del primer render (sin parpadeo). 'white' = quitar el
     atributo (usa :root claro de spes-ui.css); default sin preferencia = dark. */
  try{ var _t=localStorage.getItem('spes.portal.theme');
    if(_t==='white') document.documentElement.removeAttribute('data-theme');
    else if(_t==='gray'||_t==='dark') document.documentElement.setAttribute('data-theme',_t);
  }catch(e){}
</script>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <img class="brandimg lg" src="/assets/spes-logo.jpeg" alt="SPES Systems">
    <h1>SPES Systems</h1>
    <p class="muted">Portal del cliente</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Tu correo" required autocomplete="username">
      <input id="password" type="password" placeholder="Tu contraseña" required autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:14px" type="submit">Entrar</button>
      <p id="loginMsg" class="msg"></p>
    </form>
    <div style="display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:rgba(255,255,255,.35);font-size:12px"><span style="flex:1;height:1px;background:var(--border)"></span>o<span style="flex:1;height:1px;background:var(--border)"></span></div>
    <button class="btn ghost" id="googleBtn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
      Continuar con Google
    </button>
    <p class="muted" style="margin-top:18px">¿Problemas para entrar? Escríbenos a <a href="mailto:contacspes@gmail.com" style="color:#fff">contacspes@gmail.com</a></p>
  </div>
</div>

<div id="app" class="spes-app hidden">
  <aside id="aside" class="spes-sidebar">
    <div class="spes-brand"><img class="brandimg" src="/assets/spes-logo.jpeg" alt="S."><span class="btxt"><b>SPES Systems</b><small>Portal del cliente</small></span></div>
    <nav id="nav" class="spes-nav"></nav>
    <button id="collapseBtn" class="spes-nav-item" style="margin:2px 10px 12px;width:auto;border:0;background:transparent;color:var(--sidebar-muted);cursor:pointer"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Colapsar</span></button>
  </aside>
  <div class="spes-wrap">
    <header class="spes-topbar">
      <button class="spes-iconbtn" id="menuBtn" aria-label="Menú">☰</button>
      <span class="vt" id="viewTitle">Inicio</span>
      <span class="sp"></span>
      <span class="muted" id="who"></span>
      <button class="btn ghost sm" id="logout">Salir</button>
    </header>
    <main id="content" class="spes-main"></main>
  </div>
  <div id="backdrop" class="spes-backdrop"></div>
</div>

<div id="modal" class="modal-overlay hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="/spes-ui.js"></script>
<script src="/spes-data.js"></script>
<script>
  const SB_URL='https://khpecvszzhyygqudeagr.supabase.co';
  const SB_KEY='sb_publishable_FvWr_E6vuc7Gf3GRkzh62Q_kfzmPVp8';

  // Fase 4 (Bloque A): helpers y cliente centralizados en spes-data.js (deuda #5).
  const { esc, money, daysLeft, fdate } = SpesData;
  const fdt = SpesData.fdatetime;
  const { sb, sbc } = SpesData.client(SB_URL, SB_KEY, { detectSessionInUrl:true, flowType:'pkce' }); // portal: OAuth Google

  const $=id=>document.getElementById(id);

  // ===== MODAL =====
  function modalShell(inner){ const m=$('modal'); m.innerHTML='<div class="modal">'+inner+'</div>'; m.classList.remove('hidden'); }
  function closeModal(){ const m=$('modal'); m.classList.add('hidden'); m.innerHTML=''; }
  $('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  function notify(msg,type){ modalShell('<h3>'+(type==='error'?'Atención':'Listo')+'</h3><p style="margin-top:8px;color:rgba(255,255,255,.7);font-size:14px">'+esc(msg)+'</p><div class="mrow"><button class="btn" id="m_ok">Entendido</button></div>'); $('m_ok').onclick=closeModal; }
  function formModal(o){ o=o||{}; return new Promise(res=>{ let b=''; for(const f of o.fields){ b+='<label class="flbl">'+esc(f.label)+'</label>'; if(f.type==='select'){ b+='<select id="f_'+f.key+'">'+f.options.map(op=>{const v=(typeof op==='string')?op:op.value,l=(typeof op==='string')?op:op.label;return '<option value="'+esc(v)+'" '+(String(f.value)===String(v)?'selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select>'; } else if(f.type==='textarea'){ b+='<textarea id="f_'+f.key+'" rows="'+(f.rows||3)+'">'+esc(f.value||'')+'</textarea>'; } else { b+='<input id="f_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value==null?'':f.value)+'">'; } } modalShell('<h3>'+esc(o.title||'')+'</h3>'+b+'<p id="f_err" class="msg err"></p><div class="mrow"><button class="btn ghost" id="f_cancel">Cancelar</button><button class="btn" id="f_save">'+esc(o.submitLabel||'Guardar')+'</button></div>'); $('f_cancel').onclick=()=>{closeModal();res(null);}; $('f_save').onclick=()=>{ const vals={}; for(const f of o.fields) vals[f.key]=$('f_'+f.key).value; for(const f of o.fields){ if(f.required&&!String(vals[f.key]).trim()){ $('f_err').textContent='Completa: '+f.label; return; } } closeModal(); res(vals); }; }); }

  // ===== AUTH =====
  $('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const m=$('loginMsg'); m.textContent='Entrando…'; m.className='msg';
    try{
      const { error }=await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
      if(error){ const t=(error.message||'').toLowerCase(); m.textContent=t.includes('invalid login')?'Correo o contraseña incorrectos.':(t.includes('fetch')||t.includes('network')?'Sin conexión. Inténtalo de nuevo.':error.message); m.className='msg err'; }
    }catch(err){ m.textContent='No se pudo iniciar sesión.'; m.className='msg err'; }
  });
  $('googleBtn').addEventListener('click', async ()=>{
    const m=$('loginMsg'); m.textContent='Redirigiendo a Google…'; m.className='msg';
    try{
      const { error }=await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin+'/portal', queryParams:{ prompt:'select_account' } } });
      if(error){ m.textContent='No se pudo conectar con Google: '+error.message; m.className='msg err'; }
    }catch(_){ m.textContent='No se pudo conectar con Google.'; m.className='msg err'; }
  });
  async function cerrarSesion(){ try{ await sb.auth.signOut({scope:'local'}); }catch(_){ } try{ Object.keys(localStorage).filter(k=>k.indexOf('sb-')===0).forEach(k=>localStorage.removeItem(k)); }catch(_){ } showLogin(); }
  $('logout').addEventListener('click', cerrarSesion);
  // Fix 12-jul-2026: TOKEN_REFRESHED (cada ~1 h) y los SIGNED_IN repetidos al
  // volver a la pestaña NO deben re-arrancar la app (se sentía como recarga
  // constante de página). Solo se entra si el portal aún no está visible.
  sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==='INITIAL_SESSION') return; if(!ses||ev==='SIGNED_OUT'){ showLogin(); return; } if(!$('app').classList.contains('hidden')) return; enter(ses); });
  (async ()=>{ try{ const {data}=await sb.auth.getSession(); if(!data||!data.session){ showLogin(); return; } const {error}=await sb.auth.getUser(); if(error){ await cerrarSesion(); } else enter(data.session); }catch(_){ await cerrarSesion(); } })();
  function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

  // ===== STATE =====
  const ST={ uid:null, email:'', tab:'inicio', biz:null, sub:null, PAGOS:[], TICKETS:[], TMSGS:[], ANUNCIOS:[], VERSIONES:[], KB:[], PLANES:[], SALES:[], PRODUCTS:[], STOCK:{}, FLEET:[], ticketId:null,
    // Bloque P (Fase 2): espejo de lectura de los dominios que sincroniza el Bloque C (ADR-092).
    PURCHASES:[], RETURNS:[], CASHS:[], CASHMOVS:[], EGRESOS:[], EXPENSES:[], EMPLOYEES:[], CUSTOMERS:[], SUPPLIERS:{}, CATEGORIES:{}, POINTS:{}, MERMAS:[], MONTH_SALES:[], repPeriod:'mes' };
  const TABS=[ ['inicio','Inicio'],['ventas','Ventas'],['inventario','Inventario'],['suscripcion','Mi suscripción'],['recibos','Recibos'],['soporte','Soporte'],['novedades','Novedades'],['ayuda','Ayuda'] ];

  async function enter(session){
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    ST.uid=session.user.id; ST.email=session.user.email; $('who').textContent=session.user.email;
    await loadPortal();
    router.handle();
  }
  async function loadPortal(){
    const uid=ST.uid;
    // Fase A (Reportes): se cargan ventas CON renglones desde el 1 del mes
    // ANTERIOR para poder comparar contra el periodo previo.
    const monthStart=(()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth()-1,1).toISOString(); })();
    ST._salesFrom=monthStart;
    // Fix 12-jul-2026: PostgREST corta en 1000 filas; las consultas que pueden
    // crecer (catálogo, stock, documentos, ventas del mes) se paginan con
    // SpesData.fetchAll (envuelto para conservar la forma {data}).
    const all=(q,o)=>SpesData.fetchAll(q,o).then(rows=>({data:rows}));
    try{
      const [biz,sub,pg,tk,an,ve,kb,pl,sa,pr,fl,st,docs,pts,mov,msa]=await Promise.all([
        sbc.from('businesses').select('*').eq('id',uid).maybeSingle(),
        sbc.from('subscriptions').select('*').eq('business_id',uid).maybeSingle(),
        sbc.from('pagos').select('*').eq('business_id',uid).order('fecha',{ascending:false}),
        sbc.from('tickets').select('*').eq('business_id',uid).order('updated_at',{ascending:false}),
        sbc.from('anuncios').select('*').eq('publicado',true).order('created_at',{ascending:false}),
        sbc.from('versiones').select('*').eq('publicada',true).order('created_at',{ascending:false}),
        sbc.from('kb_articulos').select('*').eq('publicado',true).order('created_at',{ascending:false}),
        sbc.from('planes').select('*').eq('activo',true),
        sb.from('sales').select('id,folio,total,status,created_at').eq('account_id',uid).order('created_at',{ascending:false}).limit(500),
        all(()=>sb.from('records').select('record_id,data').eq('account_id',uid).eq('table_name','products').order('record_id')),
        sbc.from('fleet').select('*').eq('account_id',uid).order('last_seen_at',{ascending:false}),
        all(()=>sb.rpc('sync_stock_levels').order('product_id')),
        // Bloque P: documentos del Bloque C materializados en records (espejo de lectura).
        all(()=>sb.from('records').select('table_name,record_id,data')
          .eq('account_id',uid)
          .in('table_name',['purchase_orders','returns','cash_sessions','cash_movements','egresos','expenses','employees','customers','suppliers','categories'])
          .order('updated_at',{ascending:false}).order('record_id'),{max:10000}),
        // Saldo de lealtad = suma del log en el servidor (C1/C3). El campo
        // loyalty_points dentro de records.customers quedó obsoleto: NO usarlo.
        all(()=>sb.rpc('sync_loyalty_levels').order('customer_id')),
        // Mermas/salidas: los movimientos viajan en el log de sync (no en records).
        sb.from('sync_log').select('id,payload,client_created_at').eq('account_id',uid)
          .eq('op_type','stock.movement').order('id',{ascending:false}).limit(600),
        // Ventas del mes CON renglones (para top de productos en Reportes).
        all(()=>sb.from('sales').select('status,created_at,data').eq('account_id',uid)
          .gte('created_at',monthStart).order('created_at',{ascending:false}).order('id'),{max:5000})
      ]);
      ST.biz=biz.data||null; ST.sub=sub.data||null;
      ST.PAGOS=(pg.data||[]).map(x=>({...x,created_at:x.created_at||x.fecha}));
      ST.TICKETS=tk.data||[]; ST.ANUNCIOS=an.data||[]; ST.VERSIONES=ve.data||[]; ST.KB=kb.data||[]; ST.PLANES=pl.data||[];
      ST.SALES=sa.data||[];
      ST.PRODUCTS=(pr.data||[]).filter(r=>!(r.data&&r.data.is_deleted)).map(r=>({ id:r.record_id, ...(r.data||{}) }));
      ST.FLEET=fl.data||[];
      ST.STOCK={}; (st.data||[]).forEach(x=>{ ST.STOCK[x.product_id]=Number(x.stock); });

      // Bloque P: repartir los documentos por tabla (activos primero, sin borrados).
      const byTable={}; (docs.data||[]).forEach(r=>{ (byTable[r.table_name]=byTable[r.table_name]||[]).push({ id:r.record_id, ...(r.data||{}) }); });
      const alive=a=>(a||[]).filter(x=>!x.is_deleted);
      const byDate=(a,k)=>alive(a).sort((x,y)=>String(y[k]||'').localeCompare(String(x[k]||'')));
      ST.PURCHASES=byDate(byTable.purchase_orders,'created_at');
      ST.RETURNS=byDate(byTable.returns,'created_at');
      ST.CASHS=byDate(byTable.cash_sessions,'opened_at');
      ST.CASHMOVS=byDate(byTable.cash_movements,'created_at');
      ST.EGRESOS=byDate(byTable.egresos,'created_at');
      ST.EXPENSES=alive(byTable.expenses);
      ST.EMPLOYEES=alive(byTable.employees).sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||'')));
      ST.CUSTOMERS=alive(byTable.customers).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
      ST.SUPPLIERS={}; alive(byTable.suppliers).forEach(s=>{ ST.SUPPLIERS[s.id]=s.name||'—'; });
      ST.CATEGORIES={}; alive(byTable.categories).forEach(x=>{ ST.CATEGORIES[x.id]=x.name||'—'; });
      ST.POINTS={}; (pts.data||[]).forEach(x=>{ ST.POINTS[x.customer_id]=Number(x.points)||0; });
      // Mermas = ajustes NEGATIVOS de inventario (las ventas descuentan aparte).
      ST.MERMAS=(mov.data||[]).map(r=>r.payload||{}).filter(p=>p.type==='adjust'&&Number(p.qty_change)<0);
      ST.MONTH_SALES=(msa.data||[]).filter(s=>s.status!=='cancelled');
    }catch(e){ /* se maneja en render */ }
  }
  const planNombre=cl=>{ const p=ST.PLANES.find(x=>x.clave===cl); return p?p.nombre:(cl||'—'); };
  const precioSub=()=>{ const s=ST.sub; if(!s) return 0; if(s.precio_mxn!=null) return Number(s.precio_mxn); const p=ST.PLANES.find(x=>x.clave===s.plan); return p?Number(p.precio_mxn):0; };

  const NAVP=[
    { items:[{id:'inicio',label:'Inicio'}] },
    { group:'Mi negocio', items:[{id:'ventas',label:'Ventas'},{id:'inventario',label:'Inventario'},{id:'compras',label:'Compras'},{id:'devoluciones',label:'Devoluciones'},{id:'clientes',label:'Clientes'}] },
    { group:'Operación', items:[{id:'caja',label:'Caja'},{id:'empleados',label:'Empleados'},{id:'mermas',label:'Mermas y salidas'},{id:'reportes',label:'Reportes'},{id:'dispositivos',label:'Dispositivos'}] },
    { group:'Cuenta', items:[{id:'suscripcion',label:'Mi suscripción'},{id:'recibos',label:'Recibos'},{id:'ajustes',label:'Configuración'}] },
    { group:'Soporte', items:[{id:'soporte',label:'Soporte'},{id:'novedades',label:'Novedades'},{id:'ayuda',label:'Ayuda'}] }
  ];
  const PNAVIC={ inicio:'home', ventas:'chart', inventario:'box', compras:'truck', devoluciones:'file', clientes:'users', caja:'card', empleados:'user', mermas:'activity', reportes:'dashboard', dispositivos:'server', suscripcion:'card', recibos:'receipt', ajustes:'gear', soporte:'support', novedades:'bell', ayuda:'help' };
  const PGRUPIC={ 'Mi negocio':'chart', 'Operación':'activity', 'Cuenta':'card', 'Soporte':'support' };
  const PLABEL={}; NAVP.forEach(g=>g.items.forEach(it=>{ PLABEL[it.id]=it.label; }));
  function renderTabs(){
    SpesUI.renderSidebar($('nav'), NAVP, {
      activeId: ST.tab,
      itemIcon: id=>SpesUI.icon(PNAVIC[id]||'dot'),
      groupIcon: name=>SpesUI.icon(PGRUPIC[name]||'dot'),
      onSelect: id=>go(id),
      openKey:'spes.portal.navopen'
    });
    const grp=(NAVP.find(g=>g.group && g.items.some(it=>it.id===ST.tab))||{}).group;
    const lbl=PLABEL[ST.tab]||'Inicio';
    $('viewTitle').innerHTML = grp ? '<span class="crumb">'+esc(grp)+'</span><span class="crumb-sep">›</span>'+esc(lbl) : esc(lbl);
  }
  const router = SpesUI.createRouter({ storageKey:'spes.portal.route', default:'inicio', onRoute:applyRoute });
  function applyRoute(route){
    const parts=String(route||'inicio').split('/');
    ST.tab=parts[0]||'inicio'; ST.ticketId=(ST.tab==='soporte' && parts[1])?parts[1]:null;
    renderTabs(); render(); window.scrollTo(0,0);
    if(sidebarCtl) sidebarCtl.closeMobile();
  }
  function go(tab,ticketId){ router.go(ticketId?(tab+'/'+ticketId):tab); }
  const sidebarCtl = SpesUI.initSidebar($('aside'), { collapseBtn:$('collapseBtn'), menuBtn:$('menuBtn'), backdrop:$('backdrop') });

  function render(){
    const c=$('content');
    if(!ST.biz && ST.tab!=='soporte' && ST.tab!=='ayuda' && ST.tab!=='novedades'){
      // sin ficha de negocio (p.ej. cuenta sin businesses)
    }
    switch(ST.tab){
      case 'inicio': return rInicio(c);
      case 'ventas': return rVentas(c);
      case 'inventario': return rInventario(c);
      case 'compras': return rCompras(c);
      case 'devoluciones': return rDevoluciones(c);
      case 'clientes': return rClientes(c);
      case 'caja': return rCaja(c);
      case 'empleados': return rEmpleados(c);
      case 'mermas': return rMermas(c);
      case 'reportes': return rReportes(c);
      case 'dispositivos': return rDispositivos(c);
      case 'suscripcion': return rSuscripcion(c);
      case 'recibos': return rRecibos(c);
      case 'ajustes': return rAjustes(c);
      case 'soporte': return ST.ticketId?rTicket(c):rSoporte(c);
      case 'novedades': return rNovedades(c);
      case 'ayuda': return rAyuda(c);
      default: return rInicio(c);
    }
  }

  /** Estado vacío estándar del Bloque P: el dato existe cuando el POS (con el
   *  Bloque C) sincroniza. Espejo de lectura: aquí no se captura nada. */
  function emptySync(que){ return '<div class="state">Aún no hay '+que+' sincronizados. Actualiza tu POS a la versión más reciente y aparecerán aquí solos.</div>'; }

  function subEstadoTag(){
    const s=ST.sub; if(!s) return '<span class="tag t-neutral">sin suscripción</span>';
    const dl=daysLeft(s.vence);
    if(s.estado==='suspendida'||s.estado==='cancelada') return '<span class="tag t-bad">'+esc(s.estado)+'</span>';
    if(dl!=null&&dl<0) return '<span class="tag t-bad">vencida</span>';
    if(dl!=null&&dl<=7) return '<span class="tag t-warn">por vencer</span>';
    return '<span class="tag t-ok">'+esc(s.estado||'activa')+'</span>';
  }

  // ===== INICIO =====
  function rInicio(c){
    const nombre=ST.biz?(ST.biz.business_name||'tu negocio'):'tu negocio';
    const s=ST.sub, dl=s?daysLeft(s.vence):null;
    const tkAb=ST.TICKETS.filter(t=>!['resuelto','cerrado'].includes(t.estado)).length;
    const hoyStr=new Date().toDateString();
    const ventasHoy=ST.SALES.filter(v=>v.status!=='cancelled' && new Date(v.created_at).toDateString()===hoyStr);
    const totalHoy=ventasHoy.reduce((a,v)=>a+Number(v.total||0),0);
    c.innerHTML=`
      <h2>Hola, ${esc(nombre)}</h2>
      <p class="sub">Este es tu portal para administrar tu cuenta SPES.</p>
      <div class="cards">
        <div class="card"><div class="l">Suscripción</div><div style="margin-top:6px">${subEstadoTag()}</div><div class="l" style="margin-top:8px">${s?('Plan '+esc(planNombre(s.plan))):'—'}</div></div>
        <div class="card"><div class="n">${s&&s.vence?fdate(s.vence):'—'}</div><div class="l">Vence${dl!=null?' · '+(dl<0?'vencida':dl+' días'):''}</div></div>
        <div class="card"><div class="n">${tkAb}</div><div class="l">Tickets abiertos</div></div>
      </div>
      <div class="cards" style="margin-top:12px">
        <div class="card"><div class="n">${money(totalHoy)}</div><div class="l">Ventas de hoy</div></div>
        <div class="card"><div class="n">${ventasHoy.length}</div><div class="l">Tickets de hoy</div></div>
        <div class="card"><div class="n">${ST.FLEET.length}</div><div class="l">Dispositivos</div></div>
      </div>
      <div class="grid2" style="margin-top:20px">
        <div class="card"><div class="sechead"><h3 style="font-size:14px;font-weight:800">Alertas</h3></div>${alertasHtml()}</div>
        <div class="card"><div class="sechead"><h3 style="font-size:14px;font-weight:800">Último anuncio</h3></div>
          ${ST.ANUNCIOS.length?('<b>'+esc(ST.ANUNCIOS[0].titulo)+'</b><p class="muted" style="margin-top:6px">'+esc(ST.ANUNCIOS[0].cuerpo||'')+'</p>'):'<p class="muted">Sin anuncios por ahora.</p>'}
        </div>
      </div>
      <div class="card" style="margin-top:12px"><div class="sechead"><h3 style="font-size:14px;font-weight:800">Accesos rápidos</h3></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn ghost sm" data-goto="ventas">Ventas</button>
          <button class="btn ghost sm" data-goto="inventario">Inventario</button>
          <button class="btn ghost sm" data-goto="compras">Compras</button>
          <button class="btn ghost sm" data-goto="caja">Caja</button>
          <button class="btn ghost sm" data-goto="clientes">Clientes</button>
          <button class="btn ghost sm" data-goto="reportes">Reportes</button>
          <button class="btn ghost sm" data-goto="soporte">Soporte</button>
        </div>
      </div>`;
    c.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));
  }

  /** Alertas del negocio (Bloque P): lo que merece atención hoy. */
  function alertasHtml(){
    const al=[];
    const low=ST.PRODUCTS.filter(p=>p.is_active!==0).filter(p=>{ const s=ST.STOCK[p.id]; return s!=null&&p.stock_min!=null&&s<=Number(p.stock_min); }).length;
    if(low>0) al.push(['t-warn', low+' producto'+(low===1?'':'s')+' bajo mínimo','inventario']);
    const s=ST.sub, dl=s?daysLeft(s.vence):null;
    if(dl!=null&&dl<0) al.push(['t-bad','Tu suscripción está vencida','suscripcion']);
    else if(dl!=null&&dl<=7) al.push(['t-warn','Tu suscripción vence en '+dl+' día'+(dl===1?'':'s'),'suscripcion']);
    const frios=ST.FLEET.filter(f=>{ const d=coldDays(f); return d!=null&&d>=7; }).length;
    if(frios>0) al.push(['t-bad', frios+' dispositivo'+(frios===1?'':'s')+' sin conexión ≥ 7 días','dispositivos']);
    const viejas=ST.CASHS.filter(x=>x.status==='open'&&x.opened_at&&(Date.now()-new Date(x.opened_at).getTime())>86400000).length;
    if(viejas>0) al.push(['t-warn', viejas+' caja'+(viejas===1?'':'s')+' abierta'+(viejas===1?'':'s')+' hace más de 24 h','caja']);
    const pend=ST.PURCHASES.filter(p=>p.status==='draft'||p.status==='sent').length;
    if(pend>0) al.push(['t-neutral', pend+' compra'+(pend===1?'':'s')+' pendiente'+(pend===1?'':'s')+' de recibir','compras']);
    if(!al.length) return '<p class="muted">Sin alertas. Todo en orden.</p>';
    return al.map(a=>'<div style="display:flex;align-items:center;gap:10px;padding:5px 0"><span class="tag '+a[0]+'">!</span><span style="font-size:13.5px;flex:1">'+esc(a[1])+'</span><button class="btn ghost sm" data-goto="'+a[2]+'">Ver</button></div>').join('');
  }

  // ===== SUSCRIPCIÓN =====
  function rSuscripcion(c){
    const s=ST.sub, dl=s?daysLeft(s.vence):null;
    if(!s){ c.innerHTML='<h2>Mi suscripción</h2><p class="sub">Estado de tu plan.</p><div class="state">Aún no tienes una suscripción registrada. Escríbenos para activarla.</div>'; return; }
    c.innerHTML=`
      <h2>Mi suscripción</h2><p class="sub">Estado de tu plan SPES.</p>
      <div class="card" style="max-width:520px">
        <dl class="kv">
          <dt>Plan</dt><dd>${esc(planNombre(s.plan))}</dd>
          <dt>Estado</dt><dd>${subEstadoTag()}</dd>
          <dt>Precio</dt><dd>${money(precioSub())} / mes</dd>
          <dt>Vence</dt><dd>${s.vence?fdate(s.vence):'—'}${dl!=null?' ('+(dl<0?'vencida':dl+' días')+')':''}</dd>
        </dl>
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <a class="btn" href="mailto:contacspes@gmail.com?subject=Renovar%20suscripci%C3%B3n%20SPES">Renovar / pagar</a>
          <button class="btn ghost" data-goto="recibos">Ver recibos</button>
        </div>
        <p class="muted" style="margin-top:14px">Para cambiar de plan o método de pago, escríbenos y te ayudamos. (El autoservicio de pagos llegará pronto.)</p>
      </div>`;
    c.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));
  }

  // ===== RECIBOS =====
  function rRecibos(c){
    c.innerHTML='<h2>Recibos</h2><p class="sub">Descarga el comprobante de cada pago.</p>'+(ST.PAGOS.length?'':'<div class="state">Aún no tienes pagos registrados.</div>');
    if(!ST.PAGOS.length) return;
    let h='<div class="card" style="padding:6px 12px"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Método</th><th>Cubre hasta</th><th></th></tr></thead><tbody>';
    for(const p of ST.PAGOS) h+=`<tr><td>${fdate(p.created_at)}</td><td><strong>${money(p.monto)}</strong></td><td>${esc(p.metodo||'—')}</td><td>${p.cubre_hasta?fdate(p.cubre_hasta):'—'}</td><td style="text-align:right"><button class="btn ghost sm" data-recibo="${p.id}">Recibo PDF</button></td></tr>`;
    c.insertAdjacentHTML('beforeend',h+'</tbody></table></div>');
    c.querySelectorAll('[data-recibo]').forEach(b=>b.addEventListener('click',()=>genRecibo(b.dataset.recibo)));
  }

  // ===== SOPORTE =====
  const EST_TK={abierto:'t-warn',en_proceso:'t-warn',esperando:'t-neutral',resuelto:'t-ok',cerrado:'t-neutral'};
  function tkTag(e){ return '<span class="tag '+(EST_TK[e]||'t-neutral')+'">'+esc((e||'').replace('_',' '))+'</span>'; }
  function rSoporte(c){
    c.innerHTML=`<div class="sechead"><h2>Soporte</h2><span class="sp"></span><button class="btn sm" id="newTk">Nuevo ticket</button></div>
      <p class="sub">Abre un ticket y da seguimiento a tus solicitudes.</p>`;
    if(!ST.TICKETS.length){ c.insertAdjacentHTML('beforeend','<div class="state">No tienes tickets. Crea uno con "Nuevo ticket".</div>'); }
    else { for(const t of ST.TICKETS){ c.insertAdjacentHTML('beforeend',`<div class="item" data-tk="${t.id}" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><h3>${esc(t.asunto)}</h3>${tkTag(t.estado)}<span class="sp" style="margin-left:auto"></span><span class="meta">${fdate(t.updated_at)}</span></div></div>`); } }
    $('newTk').addEventListener('click', nuevoTicket);
    c.querySelectorAll('[data-tk]').forEach(el=>el.addEventListener('click',()=>openTicket(el.dataset.tk)));
  }
  async function nuevoTicket(){
    const v=await formModal({title:'Nuevo ticket', fields:[{key:'asunto',label:'Asunto',value:'',required:true},{key:'prioridad',label:'Prioridad',type:'select',value:'media',options:['baja','media','alta','urgente']},{key:'mensaje',label:'Cuéntanos qué pasa',type:'textarea',value:'',rows:4}], submitLabel:'Enviar'});
    if(!v) return;
    const ins=await sbc.from('tickets').insert({business_id:ST.uid, asunto:v.asunto, prioridad:v.prioridad, canal:'portal'}).select();
    if(ins.error){ notify('No se pudo crear el ticket: '+ins.error.message,'error'); return; }
    if(v.mensaje && ins.data && ins.data[0]) await sbc.from('ticket_mensajes').insert({ticket_id:ins.data[0].id, autor:ST.email, autor_tipo:'cliente', cuerpo:v.mensaje});
    await loadPortal(); go('soporte'); notify('¡Ticket enviado! Te responderemos pronto.','ok');
  }
  async function openTicket(id){ const {data}=await sbc.from('ticket_mensajes').select('*').eq('ticket_id',id).order('created_at',{ascending:true}); ST.TMSGS=data||[]; go('soporte',id); }
  function rTicket(c){
    const t=ST.TICKETS.find(x=>x.id===ST.ticketId);
    if(!t){ c.innerHTML='<div class="state">Ticket no encontrado.</div>'; return; }
    c.innerHTML=`<a class="muted" id="backTk" style="cursor:pointer">‹ Volver a soporte</a>
      <div class="sechead" style="margin-top:10px"><h2>${esc(t.asunto)}</h2>${tkTag(t.estado)}</div>
      <div class="card thread">${ST.TMSGS.length?ST.TMSGS.map(m=>`<div class="m"><div class="who">${esc(m.autor_tipo==='cliente'?'Tú':'Soporte SPES')} · ${fdt(m.created_at)}</div><div>${esc(m.cuerpo)}</div></div>`).join(''):'<p class="muted">Sin mensajes todavía.</p>'}
        <div style="display:flex;gap:8px;margin-top:12px"><input id="rep" placeholder="Escribe un mensaje…" style="margin:0"><button class="btn" id="send">Enviar</button></div>
      </div>`;
    $('backTk').onclick=()=>go('soporte');
    $('send').onclick=async ()=>{ const v=$('rep').value.trim(); if(!v) return; const {error}=await sbc.from('ticket_mensajes').insert({ticket_id:t.id,autor:ST.email,autor_tipo:'cliente',cuerpo:v}); if(error){ notify('No se pudo enviar: '+error.message,'error'); return; } await openTicket(t.id); };
  }

  // ===== NOVEDADES =====
  function rNovedades(c){
    c.innerHTML='<h2>Novedades</h2><p class="sub">Anuncios y nuevas versiones de SPES.</p>';
    let h='<div class="grid2"><div><h3 style="font-size:14px;font-weight:800;margin-bottom:10px">Anuncios</h3>';
    h+= ST.ANUNCIOS.length?ST.ANUNCIOS.map(a=>`<div class="item"><h3>${esc(a.titulo)}</h3><div class="meta">${fdate(a.created_at)}</div>${a.cuerpo?'<p class="muted" style="margin-top:6px">'+esc(a.cuerpo)+'</p>':''}</div>`).join(''):'<div class="state">Sin anuncios.</div>';
    h+='</div><div><h3 style="font-size:14px;font-weight:800;margin-bottom:10px">Versiones</h3>';
    h+= ST.VERSIONES.length?ST.VERSIONES.map(v=>`<div class="item"><h3>v${esc(v.version)}${v.titulo?' · '+esc(v.titulo):''}</h3><div class="meta">${fdate(v.created_at)}</div>${v.cambios?'<ul class="muted" style="margin:8px 0 0 16px">'+String(v.cambios).split('\n').filter(x=>x.trim()).map(x=>'<li>'+esc(x.replace(/^[-*✓\s]+/,''))+'</li>').join('')+'</ul>':''}</div>`).join(''):'<div class="state">Sin versiones publicadas.</div>';
    h+='</div></div>';
    c.insertAdjacentHTML('beforeend',h);
  }

  // ===== AYUDA =====
  function rAyuda(c){
    c.innerHTML='<h2>Ayuda</h2><p class="sub">Guías y respuestas frecuentes.</p>';
    if(!ST.KB.length){ c.insertAdjacentHTML('beforeend','<div class="state">Aún no hay artículos.</div>'); return; }
    for(const a of ST.KB) c.insertAdjacentHTML('beforeend',`<div class="item"><h3>${esc(a.titulo)}</h3>${a.categoria?'<div class="meta">'+esc(a.categoria)+'</div>':''}${a.contenido?'<p class="muted" style="margin-top:8px;white-space:pre-wrap">'+esc(a.contenido)+'</p>':''}</div>`);
  }

  // ===== VENTAS =====
  function rVentas(c){
    const comp=ST.SALES.filter(v=>v.status!=='cancelled');
    const now=new Date(), hoyStr=now.toDateString();
    const mes=comp.filter(v=>{ const d=new Date(v.created_at); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
    const hoy=comp.filter(v=>new Date(v.created_at).toDateString()===hoyStr);
    const sum=a=>a.reduce((x,v)=>x+Number(v.total||0),0);
    const totMes=sum(mes), tick=mes.length?totMes/mes.length:0;
    c.innerHTML=`<h2>Ventas</h2><p class="sub">Datos sincronizados desde tu POS.</p>
      <div class="cards">
        <div class="card"><div class="n">${money(sum(hoy))}</div><div class="l">Hoy · ${hoy.length} tickets</div></div>
        <div class="card"><div class="n">${money(totMes)}</div><div class="l">Este mes · ${mes.length} tickets</div></div>
        <div class="card"><div class="n">${money(tick)}</div><div class="l">Ticket promedio (mes)</div></div>
      </div>`;
    if(!ST.SALES.length){ c.insertAdjacentHTML('beforeend','<div class="state" style="margin-top:16px">Aún no hay ventas sincronizadas. Vende en tu POS con internet y aparecerán aquí.</div>'); return; }
    let h='<div class="card" style="margin-top:16px;padding:6px 12px"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Estado</th><th>Total</th></tr></thead><tbody>';
    for(const v of ST.SALES.slice(0,100)) h+=`<tr><td class="mono">${esc(v.folio||'—')}</td><td>${fdt(v.created_at)}</td><td>${v.status==='cancelled'?'<span class="tag t-bad">cancelada</span>':'<span class="tag t-ok">'+esc(v.status||'ok')+'</span>'}</td><td><strong>${money(v.total)}</strong></td></tr>`;
    c.insertAdjacentHTML('beforeend',h+'</tbody></table></div>');
  }

  // ===== INVENTARIO =====
  function rInventario(c){
    const prods=ST.PRODUCTS.filter(p=>p.is_active!==0);
    c.innerHTML='<h2>Inventario</h2><p class="sub">Tus productos y existencias (sincronizados desde el POS).</p>';
    if(!prods.length){ c.insertAdjacentHTML('beforeend','<div class="state">Aún no hay productos sincronizados.</div>'); return; }
    const price=p=>[p.price,p.sale_price,p.precio].find(x=>x!=null);
    const low=prods.filter(p=>{ const s=ST.STOCK[p.id]; return s!=null && p.stock_min!=null && s<=Number(p.stock_min); }).length;
    let h=`<div class="cards">
        <div class="card"><div class="n">${prods.length}</div><div class="l">Productos</div></div>
        <div class="card"><div class="n" style="color:var(--warn-fg)">${low}</div><div class="l">Bajo mínimo</div></div>
        <div class="card"><div class="n">${ST.FLEET.length}</div><div class="l">Dispositivos</div></div>
      </div>
      <div class="card" style="margin-top:16px;padding:6px 12px"><table><thead><tr><th>Producto</th><th>SKU</th><th>Stock</th><th>Mín.</th><th>Precio</th><th>Mayoreo</th></tr></thead><tbody>`;
    for(const p of prods){
      const s=ST.STOCK[p.id], bajo=s!=null && p.stock_min!=null && s<=Number(p.stock_min), pr=price(p);
      const may=Number(p.wholesale_discount_pct||0);

  // ===== REPORTES (v4: sub-modulos tipo Square + calendario SPES + grafica interactiva) =====
  const PAY_LBL={ cash:'Efectivo', card:'Tarjeta', transfer:'Transferencia', credit:'Saldo a favor' };
  function repBars(rows){
    if(!rows.length) return '<div class="state">Sin datos en este periodo.</div>';
    const max=Math.max(1,...rows.map(r=>r.total));
    return '<div class="card" style="padding:12px">'+rows.map(r=>`
      <div style="display:flex;align-items:center;gap:10px;padding:3px 0">
        <span class="muted" style="width:110px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
        <span style="flex:1;height:8px;border-radius:4px;background:var(--neutral-bg);overflow:hidden"><span style="display:block;height:100%;width:${Math.round(r.total/max*100)}%;background:var(--primary);border-radius:4px"></span></span>
        <span style="width:90px;text-align:right;font-size:12px;font-weight:700">${money(r.total)}</span>
      </div>`).join('')+'</div>';
  }
  function fmtK(v){ return v>=1000?('$'+(Math.round(v/100)/10)+'k'):('$'+Math.round(v)); }
  function smoothPath(pts){
    if(pts.length<2) return '';
    let d='M'+pts[0][0]+','+pts[0][1];
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
      d+='C'+(p1[0]+(p2[0]-p0[0])/6)+','+(p1[1]+(p2[1]-p0[1])/6)+' '+(p2[0]-(p3[0]-p1[0])/6)+','+(p2[1]-(p3[1]-p1[1])/6)+' '+p2[0]+','+p2[1];
    }
    return d;
  }
  // Grafica futurista: curvas suaves, glow, area degradada, guia + tooltip al pasar el mouse.
  function repLine(labels,series){
    const W=720,H=280,L=54,Rr=16,T=16,B=30;
    const vis=series.filter(s=>s.on);
    const max=Math.max(1,...vis.flatMap(s=>s.vals));
    const n=Math.max(2,labels.length);
    const x=i=>L+(W-L-Rr)*i/(n-1);
    const y=v=>T+(H-T-B)*(1-v/max);
    const grid=[0,.25,.5,.75,1].map(f=>{ const v=max*f; return '<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-Rr)+'" y2="'+y(v)+'" stroke="var(--border)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtK(v)+'</text>'; }).join('');
    const step=Math.max(1,Math.ceil(n/8));
    const xlab=labels.map((lb,i)=>(i%step===0||i===n-1)?('<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(lb)+'</text>'):'').join('');
    const defs='<defs><filter id="rglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+series.map((s,si)=>'<linearGradient id="rg'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'" stop-opacity=".26"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>').join('')+'</defs>';
    const paths=series.map((s,si)=>{
      if(!s.on) return '';
      const pts=s.vals.map((v,i)=>[x(i),y(v)]);
      const d=smoothPath(pts);
      const area=d+' L'+x(n-1)+','+(H-B)+' L'+x(0)+','+(H-B)+' Z';
      const dots=(n<=40)?s.vals.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.4" fill="var(--bg)" stroke="'+s.color+'" stroke-width="2"/>').join(''):'';
      return '<path d="'+area+'" fill="url(#rg'+si+')"/><path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#rglow)"/>'+dots;
    }).join('');
    const guide='<line id="rGuide" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--focus)" stroke-width="1" stroke-dasharray="4 4" opacity="0"/>';
    return '<div class="card" id="chartBox" style="padding:16px 10px 6px;position:relative"><svg id="repSvg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+defs+grid+guide+paths+xlab+'</svg></div><div class="rtip" id="rTip"></div>';
  }
  async function ensureSalesRange(fromIso){
    if(ST._salesFrom && fromIso>=ST._salesFrom) return;
    const upto=ST._salesFrom||new Date().toISOString();
    try{
      const older=await SpesData.fetchAll(()=>sb.from('sales').select('status,created_at,data').eq('account_id',ST.uid).gte('created_at',fromIso).lt('created_at',upto).order('created_at',{ascending:false}).order('id'),{max:8000});
      ST.MONTH_SALES=ST.MONTH_SALES.concat(older||[]);
      ST._salesFrom=fromIso;
    }catch(_){ /* sin red: se usa lo cargado */ }
  }

  function calHtml(){
    const v=ST.calView;
    const title=new Date(v.y,v.m,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});

  function rReportes(c){

    c.querySelectorAll('[data-rtab]').forEach(b=>b.addEventListener('click',()=>{ ST.repTab=b.dataset.rtab; rReportes(c); }));
    c.querySelectorAll('[data-per]').forEach(b=>b.addEventListener('click',()=>{ ST.repPeriod=b.dataset.per; ST.calOpen=false; ST.calSel={a:null,b:null}; rReportes(c); }));
    const cbtn=c.querySelector('#repCalBtn'); if(cbtn) cbtn.addEventListener('click',()=>{ ST.calOpen=!ST.calOpen; if(ST.calOpen){ const f=new Date((ST.repPeriod==='rango'?ST.repRange.from:ymdOf(new Date()))+'T00:00:00'); ST.calView={y:f.getFullYear(),m:f.getMonth()}; ST.calSel={a:null,b:null}; } rReportes(c); });
    c.querySelectorAll('[data-cnav]').forEach(b=>b.addEventListener('click',()=>{ let m=ST.calView.m+Number(b.dataset.cnav), y=ST.calView.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} ST.calView={y,m}; ST.calOpen=true; rReportes(c); }));
    c.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',async()=>{
      const k=b.dataset.day;
      if(!ST.calSel.a){ ST.calSel={a:k,b:null}; ST.calOpen=true; rReportes(c); return; }
      let a=ST.calSel.a, b2=k; if(b2<a){ const t2=a; a=b2; b2=t2; }
      ST.calSel={a:null,b:null}; ST.repRange={from:a,to:b2}; ST.calOpen=false;
      await ensureSalesRange(new Date(a+'T00:00:00').toISOString());
      ST.repPeriod='rango'; rReportes(c);
    }));
    const br=c.querySelector('#repBr'); if(br) br.addEventListener('change',()=>{ ST.repF.branch=br.value; rReportes(c); });
    const em=c.querySelector('#repEm'); if(em) em.addEventListener('change',()=>{ ST.repF.emp=em.value; rReportes(c); });
    const bx=c.querySelector('#repXls'); if(bx) bx.addEventListener('click',()=>{ void repExcel(); });
    const bpd=c.querySelector('#repPdfDl'); if(bpd) bpd.addEventListener('click',()=>{ void repPdfFile(); });
    const bpr=c.querySelector('#repPrn'); if(bpr) bpr.addEventListener('click',repPrint);
    c.querySelectorAll('[data-serie]').forEach(b=>b.addEventListener('click',()=>{ ST.repSeries[b.dataset.serie]=!ST.repSeries[b.dataset.serie]; rReportes(c); }));
    const q=c.querySelector('#repQ'); if(q) q.addEventListener('input',()=>{ const t2=q.value.trim().toLowerCase(); c.querySelectorAll('#artTbl tbody tr').forEach(r=>{ r.style.display=(!t2||String(r.dataset.n).indexOf(t2)>=0)?'':'none'; }); });
    const box=c.querySelector('#chartBox');
    if(box&&ST._chart){
      const M=ST._chart, svg=box.querySelector('#repSvg'), tip=c.querySelector('#rTip'), gd=box.querySelector('#rGuide');
      box.addEventListener('mousemove',ev=>{
        const r=svg.getBoundingClientRect();
        const vx=(ev.clientX-r.left)/r.width*M.W;
        let i=Math.round((vx-M.L)/((M.W-M.L-M.Rr)/(M.n-1))); i=Math.max(0,Math.min(M.labels.length-1,i));
        const gx=M.L+(M.W-M.L-M.Rr)*i/(M.n-1);
        gd.setAttribute('x1',gx); gd.setAttribute('x2',gx); gd.setAttribute('opacity','.8');
        let h='<b>'+esc(M.labels[i])+'</b>';
        M.series.forEach(s=>{ if(!s.on) return; h+='<div style="display:flex;align-items:center;gap:6px;margin-top:3px"><span style="width:8px;height:8px;border-radius:50%;background:'+s.color+'"></span><span class="muted" style="font-size:11px">'+esc(s.name)+'</span><b style="margin-left:auto;padding-left:10px">'+money(s.vals[i]||0)+'</b></div>'; });
        h+='<div class="muted" style="margin-top:3px;font-size:11px">Tickets: '+(M.tickets[i]||0)+'</div>';
        tip.innerHTML=h; tip.style.display='block'; tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY+12)+'px';
      });
      box.addEventListener('mouseleave',()=>{ tip.style.display='none'; gd.setAttribute('opacity','0'); });
    }
  }

  // ===== EXPORTACIONES (formato SPES identico a la app) =====
  function loadXLSX(){ return new Promise((res,rej)=>{ if(window.XLSX) return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('No se pudo cargar el exportador. Revisa tu internet.')); document.head.appendChild(s); }); }
  function loadH2P(){ return new Promise((res,rej)=>{ if(window.html2pdf) return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('No se pudo cargar el generador de PDF. Revisa tu internet.')); document.head.appendChild(s); }); }
  async function repExcel(){
    const R=ST._rep; if(!R){ notify('Abre Reportes y elige un periodo primero.','error'); return; }
    try{ await loadXLSX(); }catch(e){ notify(e.message,'error'); return; }
    const biz=(ST.biz&&ST.biz.business_name)||'';
    const meta=[['SPES Systems'],['Control inteligente para tu empresa.'],['Informe de ventas'+(biz?(' · '+biz):'')],['Periodo: '+R.label+' ('+R.fromStr+' – '+R.toStr+')'+(R.filterDesc?(' · '+R.filterDesc):'')],['Generado: '+new Date().toLocaleString('es-MX')+' · Portal del cliente'],[]];
    const wb=XLSX.utils.book_new();
    const resumen=meta.concat([['Indicador','Valor'],['Ventas brutas',R.gross],['Descuentos',R.desc],['Ventas netas',R.vTot],['IVA incluido',R.tax],['Tickets',R.tickets],['Ticket promedio',R.tickProm],['Efectivo',R.cashT],['Tarjeta',R.cardT],['Otros métodos',R.otrosT],['Utilidad estimada',R.uTot],['Devoluciones ('+R.devsN+')',R.devsT],['Egresos ('+R.egsN+')',R.egsT],['Mermas (unidades)',R.mermU]]);
    const sh1=XLSX.utils.aoa_to_sheet(resumen); sh1['!cols']=[{wch:34},{wch:18}];
    XLSX.utils.book_append_sheet(wb,sh1,'Resumen');
    const dias=meta.concat([['Día','Tickets','Efectivo','Tarjeta','Otros','Descuentos','Total']]).concat(R.days.map(d=>[d.day,d.tickets,d.cash,d.card,d.otros,d.desc,d.total]));
    const sh2=XLSX.utils.aoa_to_sheet(dias); sh2['!cols']=[{wch:14},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb,sh2,'Ventas por dia');
    const prods=meta.concat([['SKU','Producto','Unidades','Ingreso','Costo','Utilidad']]).concat(R.prods.map(p=>[p.sku||'',p.name,Math.round(p.qty*100)/100,p.total,p.cost,p.util]));
    const sh3=XLSX.utils.aoa_to_sheet(prods); sh3['!cols']=[{wch:12},{wch:34},{wch:10},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,sh3,'Productos');
    const des=meta.concat([['Método de pago','Total']]).concat(R.pays.map(p=>[p.label,p.total])).concat([[''],['Empleado','Tickets','Vendido']]).concat(R.emps.map(e=>[e.name,e.n,e.total]));
    const sh4=XLSX.utils.aoa_to_sheet(des); sh4['!cols']=[{wch:28},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,sh4,'Desgloses');
    XLSX.writeFile(wb,'SPES-Reporte-'+R.fileTag+'.xlsx');
  }
  // Cuerpo del reporte formato SPES (plantilla identica a reportHtml de la app),
  // con estilos SCOPED a .spesrep para poder montarlo en la pagina sin chocar.
  function repBody(R){
    const period=R.fromStr===R.toStr?R.fromStr:(R.fromStr+' a '+R.toStr);
    const sub='Periodo: '+period+(R.filterDesc?(' · '+R.filterDesc):'');
    const marginPct=R.vTot>0?Math.round((R.uTot/R.vTot)*100):0;
    const biz=(ST.biz&&ST.biz.business_name)||'';
    const kpis=[['Ventas totales',money(R.vTot)],['Tickets',String(R.tickets)],['Ticket promedio',R.tickets>0?money(R.tickProm):'—'],['Utilidad estimada',money(R.uTot)]];
    const kpiCards=kpis.map(k=>'<div class="kpi"><div class="kv">'+esc(k[1])+'</div><div class="kl">'+esc(k[0])+'</div></div>').join('');
    const sr=(cls,l,v)=>'<tr class="'+cls+'"><td class="'+((cls==='ind'||cls==='sub')?'ind':'')+'">'+esc(l)+'</td><td class="v">'+esc(v)+'</td></tr>';
    const summary='<table class="sum"><tbody><tr class="cap"><td>Resumen</td><td class="v">'+esc(period)+'</td></tr>'
      +sr('sec','Ventas brutas',money(R.gross))+sr('ind','Descuentos','- '+money(R.desc))+sr('sec','Ventas netas',money(R.vTot))+sr('ind','IVA incluido',money(R.tax))
      +sr('top','Total cobrado',money(R.vTot))+sr('sub','Tarjeta',money(R.cardT))+sr('sub','Efectivo',money(R.cashT))+(R.otrosT>0?sr('sub','Otros métodos',money(R.otrosT)):'')
      +sr('top','Utilidad estimada',money(R.uTot))+sr('ind','Margen bruto',marginPct+'%')+'</tbody></table>';
    const th=a=>'<tr>'+a.map((h,i)=>'<th style="text-align:'+(i===0?'left':'right')+'">'+esc(h)+'</th>').join('')+'</tr>';
    const tr2=a=>'<tr>'+a.map((x2,i)=>'<td style="text-align:'+(i===0?'left':'right')+(i===0?'':';font-variant-numeric:tabular-nums')+'">'+x2+'</td>').join('')+'</tr>';
    const tf=a=>'<tr class="tot">'+a.map((x2,i)=>'<td style="text-align:'+(i===0?'left':'right')+'">'+x2+'</td>').join('')+'</tr>';
    let det='';
    if(R.days.length){
      det+='<div class="dttl">Detalle por día</div><table><thead>'+th(['Periodo','Tickets','Efectivo','Tarjeta','Descuentos','Total'])+'</thead><tbody>'
        +R.days.map(d=>tr2([esc(d.day),String(d.tickets),money(d.cash),money(d.card),money(d.desc),money(d.total)])).join('')
        +tf(['Total',String(R.tickets),money(R.cashT),money(R.cardT),money(R.desc),money(R.vTot)])+'</tbody></table>';
    }
    if(R.prods.length){
      det+='<div class="dttl" style="margin-top:16px">Detalle por producto</div><table><thead>'+th(['Producto','Unidades','Ingreso','Costo','Utilidad'])+'</thead><tbody>'
        +R.prods.map(p=>tr2([esc(p.name),String(Math.round(p.qty*100)/100),money(p.total),money(p.cost),money(p.util)])).join('')
        +tf(['Total',String(Math.round(R.units*100)/100),money(R.prodT),money(R.costT),money(R.uTot)])+'</tbody></table>';
    }
    const css='.spesrep{background:#fff;color:#1f2937;font-family:Arial,Helvetica,sans-serif;font-size:12px;padding:28px 32px;max-width:816px;margin:0 auto}'
      +'.spesrep .hd{display:flex;align-items:center;gap:14px;border-bottom:3px solid #111827;padding-bottom:14px}.spesrep .hd img{height:44px;width:auto;border-radius:8px}'
      +'.spesrep .brand .app{font-size:18px;font-weight:800;color:#111827;letter-spacing:.2px}.spesrep .brand .slg{font-size:11px;color:#6b7280}'
      +'.spesrep .meta{margin-left:auto;text-align:right}.spesrep .meta .t{font-size:15px;font-weight:700;color:#111827}.spesrep .meta .s{font-size:11px;color:#6b7280;margin-top:2px}'
      +'.spesrep .kpis{display:flex;gap:10px;margin:18px 0}.spesrep .kpi{flex:1;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;background:#f9fafb}'
      +'.spesrep .kpi .kv{font-size:18px;font-weight:800;color:#111827}.spesrep .kpi .kl{font-size:10px;color:#6b7280;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}'
      +'.spesrep table{width:100%;border-collapse:collapse;margin-top:6px}.spesrep th{background:#111827;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;font-weight:600}'
      +'.spesrep td{padding:7px 10px;border-bottom:1px solid #eef2f5}.spesrep tr:nth-child(even) td{background:#f9fafb}'
      +'.spesrep tr.tot td{border-top:2px solid #111827;border-bottom:none;font-weight:800;color:#111827;background:#f3f4f6}'
      +'.spesrep .sum{width:100%;border-collapse:collapse;margin:6px 0 20px;border:1px solid #e5e7eb}.spesrep .sum td{padding:7px 12px;border-bottom:1px solid #eef2f5;font-size:12px}'
      +'.spesrep .sum td.v{text-align:right;font-variant-numeric:tabular-nums}.spesrep .sum tr.cap td{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;background:#f3f4f6;font-weight:700}'
      +'.spesrep .sum tr.sec td{font-weight:700;color:#111827}.spesrep .sum tr.top td{border-top:2px solid #111827;font-weight:800;color:#111827;background:#f3f4f6}.spesrep .sum td.ind{padding-left:26px;color:#6b7280}'
      +'.spesrep .dttl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;font-weight:700;margin-bottom:4px}'
      +'.spesrep .ft{margin-top:24px;border-top:1px solid #e5e7eb;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#6b7280}.spesrep .ft b{color:#111827}';
    return '<div class="spesrep"><style>'+css+'<\/style>'
      +'<div class="hd"><img src="'+location.origin+'/assets/spes-logo.jpeg" alt="SPES"/>'
      +'<div class="brand"><div class="app">SPES Systems<\/div><div class="slg">Control inteligente para tu empresa.<\/div><\/div>'
      +'<div class="meta"><div class="t">Informe de ventas'+(biz?(' · '+esc(biz)):'')+'<\/div><div class="s">'+esc(sub)+'<\/div><\/div><\/div>'
      +'<div class="kpis">'+kpiCards+'<\/div>'+summary+det
      +'<div class="ft"><span>Generado desde el Portal del cliente · '+esc(new Date().toLocaleString('es-MX'))+'<\/span><span>Reporte creado con <b>SPES Systems<\/b> · Control inteligente para tu empresa.<\/span><\/div><\/div>';
  }
  // Exportar PDF: DESCARGA el archivo directamente (sin abrir ventanas).
  async function repPdfFile(){
    const R=ST._rep; if(!R){ notify('Abre Reportes y elige un periodo primero.','error'); return; }
    try{ await loadH2P(); }catch(e){ notify(e.message,'error'); return; }
    const holder=document.createElement('div');
    holder.style.cssText='position:fixed;left:-10000px;top:0;width:816px;background:#fff;z-index:-1;';
    holder.innerHTML=repBody(R);
    document.body.appendChild(holder);
    try{
      await html2pdf().set({margin:0,filename:'SPES-Reporte-'+R.fileTag+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'pt',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(holder.firstChild).save();
    }catch(e){ notify('No se pudo generar el PDF: '+(e&&e.message||e),'error'); }
    holder.remove();
  }
  // Imprimir reporte: en ESTA misma pagina (iframe oculto), sin ventanas nuevas.
  function repPrint(){
    const R=ST._rep; if(!R){ notify('Abre Reportes y elige un periodo primero.','error'); return; }
    const old=document.getElementById('repPrintFrame'); if(old) old.remove();
    const f=document.createElement('iframe');
    f.id='repPrintFrame';
    f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(f);
    const d=f.contentDocument;
    d.open();
    d.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de ventas<\/title><style>@page{size:Letter;margin:0}body{margin:0}<\/style><\/head><body>'+repBody(R)+'<\/body><\/html>');
    d.close();
    setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(_){ notify('No se pudo abrir la impresión.','error'); } },450);
  }

  // ===== CONFIGURACION (tema del portal, como Apariencia en la app) =====
  const PORTAL_THEMES=[
    ['white','Blanco','#f5f6f8','#ffffff'],
    ['gray','Gris','#e7eaee','#5e6c7f'],
    ['dark','Oscuro','#000000','#2a2a2a']
  ];
  function portalTheme(){ try{ const t=localStorage.getItem('spes.portal.theme'); return (t==='white'||t==='gray'||t==='dark')?t:'dark'; }catch(_){ return 'dark'; } }
  function setPortalTheme(t){ try{ localStorage.setItem('spes.portal.theme',t); }catch(_){ } if(t==='white') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
  function rAjustes(c){
    const cur=portalTheme();
    c.innerHTML=`<h2>Configuración</h2><p class="sub">Personaliza tu portal.</p>
      <div class="card" style="max-width:560px">
        <div class="sechead"><h3 style="font-size:14px;font-weight:800">Tema</h3></div>
        <p class="muted" style="margin-bottom:12px;font-size:13px">El color de fondo del portal, igual que en tu punto de venta: Blanco, Gris u Oscuro.</p>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${PORTAL_THEMES.map(t=>`
            <button class="themeopt ${t[0]===cur?'on':''}" data-theme-opt="${t[0]}">
              <span class="sw" style="background:linear-gradient(135deg, ${t[2]} 50%, ${t[3]} 50%)"></span>
              <span style="flex:1;font-weight:600">${t[1]}</span>
              ${t[0]===cur?'<span class="tag t-ok">activo</span>':''}
            </button>`).join('')}
        </div>
        <p class="muted" style="margin-top:12px;font-size:12px">Tu preferencia se guarda en este navegador.</p>
      </div>`;
    c.querySelectorAll('[data-theme-opt]').forEach(b=>b.addEventListener('click',()=>{ setPortalTheme(b.dataset.themeOpt); rAjustes(c); }));
  }

  // ===== DISPOSITIVOS =====
  function coldDays(f){ if(!f.last_seen_at) return null; return Math.floor((Date.now()-new Date(f.last_seen_at).getTime())/86400000); }
  function rDispositivos(c){
    const frios=ST.FLEET.filter(f=>{ const d=coldDays(f); return d!=null&&d>=7; });
    c.innerHTML=`<h2>Dispositivos</h2><p class="sub">Las cajas de tu negocio conectadas a la nube SPES.</p>
      <div class="cards">
        <div class="card"><div class="n">${ST.FLEET.length}</div><div class="l">Dispositivos</div></div>
        <div class="card"><div class="n"${frios.length?' style="color:var(--bad-fg)"':''}>${frios.length}</div><div class="l">Sin conexión ≥ 7 días</div></div>
        <div class="card"><div class="n">${esc(ST.FLEET[0]&&ST.FLEET[0].app_version||'—')}</div><div class="l">Versión más reciente vista</div></div>
      </div>`;
    if(!ST.FLEET.length){ c.insertAdjacentHTML('beforeend','<div style="margin-top:16px"></div><div class="state">Aún no hay dispositivos reportados. Abre tu POS con internet y aparecerá aquí.</div>'); return; }
    let h='<div class="card" style="margin-top:16px;padding:6px 12px;overflow-x:auto"><table><thead><tr><th>Dispositivo</th><th>Versión</th><th>Plataforma</th><th>Primera conexión</th><th>Última conexión</th><th>Estado</th></tr></thead><tbody>';
    for(const f of ST.FLEET){ const d=coldDays(f);
      h+=`<tr><td class="mono">${esc(String(f.device_id||'').slice(0,8))}</td><td class="mono">${esc(f.app_version||'—')}</td><td class="muted">${esc(f.platform||'—')}</td><td class="muted">${f.first_seen_at?fdate(f.first_seen_at):'—'}</td><td>${f.last_seen_at?fdt(f.last_seen_at):'—'}</td><td>${d==null?'<span class="tag t-neutral">—</span>':(d>=7?'<span class="tag t-bad">'+d+' días sin conexión</span>':'<span class="tag t-ok">en línea reciente</span>')}</td></tr>`;
    }
    c.insertAdjacentHTML('beforeend',h+'</tbody></table></div>');
  }

  // ===== RECIBO PDF =====
  // Fase 4: generador único en spes-data.js. Bonus: el recibo del portal ahora
  // trae el branding de SPES (nombre/color/pie) leyendo control.config (lectura pública).
  let _cfgRecibo;
  async function genRecibo(pid){
    const p=ST.PAGOS.find(x=>x.id===pid); if(!p) return;
    try{
      if(_cfgRecibo===undefined){ try{ _cfgRecibo=(await sbc.from('config').select('empresa_nombre,logo_url,color_acento,recibo_pie').maybeSingle()).data||null; }catch(_){ _cfgRecibo=null; } }
      await SpesData.recibo(p, ST.biz||{}, _cfgRecibo);
    }catch(e){ notify('No se pudo generar el recibo: '+(e.message||e),'error'); }
  }
</script>
